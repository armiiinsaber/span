services:
  - type: web
    name: span
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /manifest.webmanifest
    autoDeploy: true
    domains:
      - span.melomaniacstudios.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: medium
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SPAN_PASSCODE
        sync: false
