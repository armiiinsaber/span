<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Span</title>
<meta name="description" content="Plan in 10 day spans.">
<meta name="theme-color" content="#F5F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Span">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/fonts/melomaniac-serif-v0.1.woff" as="font" type="font/woff" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Melomaniac Serif';
  src: url('/fonts/melomaniac-serif-v0.1.woff') format('woff');
  font-weight: 400 900;
  font-display: swap;
}
:root {
  --green: #B8F06E;
  --green-ink: #24350D;
  --paper: #F5F3EC;
  --paper-deep: #ECE9DF;
  --ink: #141310;
  --ink-soft: rgba(20,19,16,.55);
  --ink-faint: rgba(20,19,16,.28);
  --hairline: rgba(20,19,16,.14);
  --serif: 'Melomaniac Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --gutter: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
::selection { background: var(--green); color: var(--ink); }
h1, h2, h3 { text-wrap: balance; font-weight: 400; margin: 0; }
p, li, .pretty { text-wrap: pretty; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--safe-t) + 20px) var(--gutter) calc(var(--safe-b) + 96px);
}
.top {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 40px;
}
.mark { font-family: var(--serif); font-size: 22px; letter-spacing: -.01em; }
.top .meta { font-size: 13px; color: var(--ink-soft); }

.eyebrow {
  font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-soft);
}
.head { text-align: center; margin-bottom: 36px; }
.head .eyebrow { margin-bottom: 14px; }
.display {
  font-family: var(--serif);
  font-size: clamp(40px, 11vw, 60px);
  line-height: .95; letter-spacing: -.02em;
}
.display.small { font-size: clamp(32px, 8.5vw, 44px); line-height: 1.05; }
.sub { margin-top: 12px; font-size: 14px; color: var(--ink-soft); }

.label {
  font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-soft); margin: 0 0 12px;
}
.section { margin-top: 44px; }
.rule { border: 0; border-top: 1px solid var(--hairline); margin: 32px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px;
  border: 1px solid var(--ink); border-radius: 2px; background: transparent;
  font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
  transition: background .6s var(--ease);
}
.btn:active { background: var(--paper-deep); }
.btn.primary { background: var(--green); border-color: var(--ink); }
.btn.primary:active { background: #a9e25e; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: default; }
.link {
  background: none; border: 0; padding: 8px 0;
  font-size: 14px; color: var(--ink-soft);
  text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px;
}
.link:active { color: var(--green-ink); }
.actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 28px; }

/* Composer: the Claude input, set as part of the page */
.composer { position: relative; margin-top: 8px; }
.composer textarea {
  display: block; width: 100%; resize: none; overflow: hidden;
  border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent;
  padding: 10px 96px 14px 0; min-height: 52px;
  font-family: var(--serif); font-size: 22px; line-height: 1.3; letter-spacing: -.005em;
}
.composer textarea::placeholder { color: var(--ink-faint); }
.composer textarea:focus { outline: none; border-bottom-width: 2px; padding-bottom: 13px; }
.composer .tools { position: absolute; right: 0; bottom: 8px; display: flex; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center;
  border: 1px solid var(--hairline); border-radius: 50%; background: transparent; padding: 0;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.send { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.icon-btn.send[disabled] { background: transparent; border-color: var(--hairline); color: var(--ink-faint); }
.icon-btn.listening { border-color: var(--ink); animation: breathe 1.6s var(--ease) infinite alternate; }
@keyframes breathe { from { box-shadow: 0 0 0 0 rgba(20,19,16,.12); } to { box-shadow: 0 0 0 8px rgba(20,19,16,0); } }

.note {
  font-family: var(--serif); font-size: 20px; line-height: 1.4; letter-spacing: -.005em;
  text-align: center; margin: 0 auto 8px; max-width: 30ch;
}
.question { font-size: 15px; text-align: center; margin: 12px auto 0; max-width: 34ch; }
.question::before { content: ''; display: block; width: 24px; height: 1px; background: var(--ink); margin: 0 auto 12px; }

/* Loading */
.loading { text-align: center; padding: 40px 0 8px; }
.loading .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
.loading .dots i {
  width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink);
  animation: fill 3s var(--ease) infinite;
}
.loading .dots i:nth-child(10) { border-style: dotted; }
@keyframes fill { 0%, 100% { background: transparent; } 30%, 60% { background: var(--ink); } }
.loading p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.error { text-align: center; font-size: 14px; margin: 20px 0 0; }

/* Span grid */
.grid { --cols: 10; }
.grid .days, .grid .cells {
  display: grid; grid-template-columns: repeat(var(--cols), 1fr);
}
.grid .days { border-bottom: 1px solid var(--hairline); padding-bottom: 10px; margin-bottom: 4px; }
.grid .day-h {
  text-align: center; background: none; border: 0; padding: 4px 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.grid .day-h b { font-family: var(--serif); font-weight: 400; font-size: 20px; line-height: 1; }
.grid .day-h small { font-size: 10px; color: var(--ink-soft); letter-spacing: .02em; }
.grid .day-h.today b { position: relative; }
.grid .day-h.today b::after {
  content: ''; position: absolute; left: -3px; right: -3px; bottom: -4px; height: 3px; background: var(--green);
}
.grid .day-h.review b { color: var(--ink-soft); }
.grid .row { padding: 14px 0 12px; border-bottom: 1px solid var(--hairline); }
.grid .row-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.grid .row-h .name { font-size: 15px; font-weight: 500; }
.grid .row-h .name em { font-style: normal; font-weight: 400; color: var(--ink-soft); font-size: 13px; margin-left: 6px; }
.grid .row-h .count { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid .cell {
  height: 30px; display: grid; place-items: center;
  border: 0; background: none; padding: 0; border-radius: 2px;
}
.grid .cell.review { background: var(--paper-deep); }
.grid .dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink); background: transparent;
  transition: background .6s var(--ease), transform .3s var(--ease);
}
.grid .dot.done { background: var(--green); }
.grid .dot.missed { border-color: var(--ink-faint); }
.grid .dot.abstain { border-radius: 3px; }
.grid.editing .cell:not(.review) { outline: 1px dashed transparent; }
.grid.editing .cell.empty:not(.review)::after {
  content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint);
}
.grid.editing .dot { touch-action: none; cursor: grab; }
.grid .cell.drop { background: var(--paper-deep); }
.grid .dot.dragging { transform: scale(1.35); }
.grid .row-edit { display: flex; justify-content: flex-end; margin-top: 4px; }
.grid .row-edit .link { font-size: 12px; padding: 2px 0; }
.legend { display: flex; justify-content: center; gap: 18px; margin-top: 16px; font-size: 12px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-block; }
.legend i.sq { border-radius: 2px; }
.legend i.done { background: var(--green); }
.hint { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 14px 0 0; }
.bar { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; }

/* Items (today, day) */
.items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.item {
  display: flex; align-items: center; gap: 16px; width: 100%;
  padding: 16px 0; border: 0; border-bottom: 1px solid var(--hairline); background: none; text-align: left;
}
.check {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  border: 1.5px solid var(--ink); display: grid; place-items: center;
  transition: background .6s var(--ease);
}
.check.sq { border-radius: 4px; }
.check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .4s var(--ease); }
.item.done .check { background: var(--green); }
.item.done .check svg { opacity: 1; }
.item .txt { flex: 1; min-width: 0; }
.item .nm { font-size: 18px; line-height: 1.3; }
.item.done .nm { color: var(--ink-soft); }
.item .dt { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.empty-day { text-align: center; color: var(--ink-soft); font-size: 15px; padding: 24px 0; margin: 0; }

.field {
  display: block; width: 100%; resize: none;
  border: 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
  background: transparent; padding: 14px 0; min-height: 120px;
  font-size: 16px; line-height: 1.55;
}
.field:focus { outline: none; border-color: var(--ink); }
.field::placeholder { color: var(--ink-faint); }
.saved { font-size: 12px; color: var(--ink-soft); text-align: right; min-height: 18px; margin-top: 6px; opacity: 0; transition: opacity .6s var(--ease); }
.saved.on { opacity: 1; }
.moved { text-align: center; font-size: 14px; margin: 14px auto 0; max-width: 34ch; }

/* Review */
.tally { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.tally li { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
.tally .n { font-family: var(--serif); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.tally .n small { font-size: 16px; color: var(--ink-soft); }
.notes-list { list-style: none; margin: 0; padding: 0; }
.notes-list li { padding: 12px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; }
.notes-list b { font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-bottom: 4px; }
.read { font-family: var(--serif); font-size: 21px; line-height: 1.42; margin: 0; }

/* Archive */
.past { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.past > li { border-bottom: 1px solid var(--hairline); }
.past button.sum { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; background: none; border: 0; text-align: left; }
.past .pct { font-family: var(--serif); font-size: 34px; line-height: 1; }
.past .when { font-size: 13px; color: var(--ink-soft); }
.past .ttl { font-size: 17px; }
.past .more { padding: 0 0 22px; }
.past .more p { margin: 0 0 16px; }

/* Forms */
.form { display: grid; gap: 14px; padding: 18px 0 6px; }
.input {
  width: 100%; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent;
  padding: 10px 0; font-size: 17px;
}
.input:focus { outline: none; border-bottom-width: 2px; padding-bottom: 9px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ink); border-radius: 2px; }
.seg button { border: 0; background: none; min-height: 42px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stepper { display: flex; align-items: center; justify-content: space-between; }
.stepper .val { font-family: var(--serif); font-size: 28px; min-width: 2ch; text-align: center; }
.stepper .ctl { display: flex; align-items: center; gap: 14px; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--hairline); gap: 16px; }
.settings-row:first-child { border-top: 1px solid var(--hairline); }
.settings-row input[type="date"] { border: 0; background: none; font-size: 15px; text-align: right; }

/* Login */
.login { min-height: 70dvh; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.login .display { font-size: 72px; margin-bottom: 40px; }
.login form { display: grid; gap: 18px; max-width: 280px; margin: 0 auto; width: 100%; }
.login .input { text-align: center; letter-spacing: .3em; }

/* Nav */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: rgba(245,243,236,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--hairline);
  padding-bottom: var(--safe-b);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button {
  background: none; border: 0; height: 58px; position: relative;
  font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft);
}
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"]::before {
  content: ''; position: absolute; top: -1px; left: 50%; width: 22px; margin-left: -11px; height: 3px; background: var(--green);
}

.fade { animation: rise .7s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .loading .dots i:nth-child(-n+4) { background: var(--ink); }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <div class="in">
    <button data-tab="today">Today</button>
    <button data-tab="span">Span</button>
    <button data-tab="past">Past</button>
    <button data-tab="settings">Settings</button>
  </div>
</nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* Storage */

const KEY = 'span.v1';
const blank = () => ({ v: 1, current: null, next: null, spans: [] });
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const d = JSON.parse(raw);
    return isState(d) ? d : blank();
  } catch { return blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}
function isState(d) {
  return d && typeof d === 'object' && d.v === 1 && Array.isArray(d.spans);
}

/* Dates. The UI never names weekdays; Claude gets them. */

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayIso = () => iso(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmt = s => { const d = parse(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const range = start => `${fmt(start)} to ${fmt(addDays(start, 9))}`;
const dayDate = (span, n) => addDays(span.start, n - 1);
const dayNum = span => diffDays(span.start, todayIso()) + 1;
function dayMap(start) {
  return Array.from({ length: 10 }, (_, i) => {
    const date = addDays(start, i);
    return { day: i + 1, date, weekday: WEEKDAYS[parse(date).getDay()] };
  });
}

/* Helpers */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Glue the last two words so a line never ends on a lone word.
const nb = s => esc(s).replace(/ (\S+)$/, '&nbsp;$1');
const uid = () => Math.random().toString(36).slice(2, 9);
const slug = s => (s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'item').slice(0, 24);

function newSpan(start) {
  return { id: uid(), start, status: 'planning', intentions: [], occurrences: [], notes: {}, log: [], note: '', question: '', reflection: '', review: '' };
}
const occOf = (span, iid) => span.occurrences.filter(o => o.intention_id === iid);
const findOcc = (span, iid, day) => span.occurrences.find(o => o.intention_id === iid && o.day === day);
function syncTargets(span) {
  for (const it of span.intentions) it.target = occOf(span, it.id).length;
  span.intentions = span.intentions.filter(it => it.target > 0 || it._keep);
}
// Even spread of n occurrences over the open days.
function spread(n, from = 1) {
  const days = [];
  for (let d = Math.max(1, from); d <= 9; d++) days.push(d);
  if (n >= days.length) return days;
  const out = [];
  for (let i = 0; i < n; i++) out.push(days[Math.floor((i + .5) * days.length / n)]);
  return out;
}
function summary(span) {
  const parts = span.intentions.map(it => {
    const occ = occOf(span, it.id);
    return `${it.name} ${occ.filter(o => o.done).length}/${occ.length}`;
  });
  const bits = [`Span ${range(span.start)}: ${parts.join(', ') || 'nothing planned'}.`];
  if (span.reflection) bits.push(`Their reflection: ${span.reflection}`);
  if (span.review) bits.push(`Your read: ${span.review}`);
  return bits.join(' ');
}
function completion(span) {
  const all = span.occurrences.length;
  return all ? Math.round(100 * span.occurrences.filter(o => o.done).length / all) : 0;
}
function planState(span) {
  return {
    intentions: span.intentions.map(({ id, name, type, tag, target }) => ({ id, name, type, tag: tag || '', target })),
    occurrences: span.occurrences.map(({ intention_id, day, done, detail }) => ({ intention_id, day, done: Boolean(done), detail: detail || '' })),
    notes: span.notes,
  };
}
function applyPlan(span, p) {
  const prev = new Map(span.occurrences.map(o => [`${o.intention_id}@${o.day}`, o]));
  span.intentions = p.intentions.map(it => ({ ...it }));
  span.occurrences = p.occurrences.map(o => ({
    intention_id: o.intention_id, day: o.day, detail: o.detail,
    done: Boolean(prev.get(`${o.intention_id}@${o.day}`)?.done),
  }));
  span.note = p.note;
  span.question = p.question;
}

/* Icons */

const I = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#141310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};

/* API */

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { ui.locked = true; render(); }
  if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
  return data;
}

function askClaude(mode, span, message, extra = {}) {
  const today = todayIso();
  return api('/api/plan', {
    mode,
    message,
    today: `${WEEKDAYS[new Date().getDay()]} ${today}`,
    currentDay: span.status === 'live' ? dayNum(span) : null,
    days: dayMap(extra.start || span.start),
    plan: planState(span),
    history: (extra.log || span.log).slice(-10),
    past: S.spans.slice(0, 3).map(summary),
    reflection: extra.reflection || '',
  }).then(r => r.plan);
}

/* UI state (not persisted) */

const ui = {
  tab: 'today',
  day: null,
  editing: false,
  busy: null,
  error: '',
  retry: null,
  moved: '',
  undo: null,
  locked: false,
  awake: false,
  openPast: null,
  addOpen: false,
  addType: 'do',
  addCount: 3,
};

const $app = document.getElementById('app');
const $tabs = document.getElementById('tabs');

/* Views */

function header(meta = '') {
  return `<div class="top"><span class="mark">Span</span><span class="meta">${meta}</span></div>`;
}

function loadingView(text) {
  return `<div class="loading fade" role="status"><div class="dots">${'<i></i>'.repeat(10)}</div><p>${esc(text)}</p></div>`;
}

function errorView() {
  if (!ui.error) return '';
  return `<p class="error" role="alert">${nb(ui.error)}</p>
    ${ui.retry ? '<div class="actions" style="margin-top:12px"><button class="btn" data-a="retry">Try again</button></div>' : ''}`;
}

function composer(text, id = 'msg') {
  const placeholder = text.replace(/ (\S+)$/, '\u00a0$1');
  const mic = SR ? `<button class="icon-btn" type="button" data-a="mic" aria-label="Speak">${I.mic}</button>` : '';
  return `<form class="composer" data-form="${id}" autocomplete="off">
    <label class="sr" for="${id}">${esc(placeholder)}</label>
    <textarea id="${id}" rows="1" placeholder="${esc(placeholder)}" enterkeyhint="send"></textarea>
    <div class="tools">${mic}<button class="icon-btn send" type="submit" aria-label="Send" disabled>${I.up}</button></div>
  </form>`;
}

function grid(span, { editable = false, live = false } = {}) {
  const today = live ? dayNum(span) : 0;
  let h = `<div class="grid${ui.editing && editable ? ' editing' : ''}" data-span="${span === S.next ? 'next' : 'current'}">`;
  h += '<div class="days">';
  for (let d = 1; d <= 10; d++) {
    const cls = ['day-h', d === today ? 'today' : '', d === 10 ? 'review' : ''].join(' ');
    h += `<button class="${cls}" ${live ? `data-a="open-day" data-day="${d}"` : 'tabindex="-1"'} aria-label="Day ${d}, ${fmt(dayDate(span, d))}"><b>${d}</b><small>${parse(dayDate(span, d)).getDate()}</small></button>`;
  }
  h += '</div>';
  for (const it of span.intentions) {
    const occ = occOf(span, it.id);
    const done = occ.filter(o => o.done).length;
    h += `<div class="row"><div class="row-h"><span class="name">${esc(it.name)}${it.tag ? `<em>${esc(it.tag)}</em>` : ''}</span>
      <span class="count">${live ? `${done} of ${occ.length}` : `${occ.length}×`}</span></div><div class="cells">`;
    for (let d = 1; d <= 10; d++) {
      const o = findOcc(span, it.id, d);
      const cls = ['cell', d === 10 ? 'review' : '', o ? '' : 'empty'].join(' ');
      let dot = '';
      if (o) {
        const missed = live && !o.done && d < today;
        dot = `<span class="dot${o.done ? ' done' : ''}${missed ? ' missed' : ''}${it.type === 'abstain' ? ' abstain' : ''}" data-iid="${esc(it.id)}" data-day="${d}"></span>`;
      }
      h += `<button class="${cls}" data-a="cell" data-iid="${esc(it.id)}" data-day="${d}" aria-label="${esc(it.name)}, day ${d}${o ? (o.done ? ', done' : ', planned') : ''}">${dot}</button>`;
    }
    h += '</div>';
    if (ui.editing && editable) h += `<div class="row-edit"><button class="link" data-a="remove-int" data-iid="${esc(it.id)}">Remove</button></div>`;
    h += '</div>';
  }
  h += '</div>';
  if (span.intentions.length) {
    h += '<div class="legend"><span><i></i>Do or see</span><span><i class="sq"></i>Hold back</span><span><i class="done"></i>Done</span></div>';
  }
  return h;
}

function addForm() {
  if (!ui.addOpen) return `<div class="actions"><button class="link" data-a="add-open">Add an intention</button></div>`;
  const types = [['do', 'Do'], ['see', 'See'], ['abstain', 'Hold back']];
  return `<form class="form fade" data-form="add" autocomplete="off">
    <input class="input" id="addName" placeholder="Name it" maxlength="40" required>
    <div class="seg" role="group" aria-label="Type">${types.map(([v, l]) => `<button type="button" data-a="add-type" data-v="${v}" aria-pressed="${ui.addType === v}">${l}</button>`).join('')}</div>
    <div class="stepper"><span class="eyebrow">Times</span><div class="ctl">
      <button type="button" class="icon-btn" data-a="add-count" data-v="-1" aria-label="Fewer">&minus;</button>
      <span class="val">${ui.addCount}</span>
      <button type="button" class="icon-btn" data-a="add-count" data-v="1" aria-label="More">+</button></div></div>
    <button class="btn block" type="submit">Add</button>
    <button class="link" type="button" data-a="add-close">Cancel</button>
  </form>`;
}

function editBar(span) {
  if (!span.intentions.length && !ui.editing) return '';
  return `<div class="bar"><span class="eyebrow">${ui.editing ? 'Editing' : `${span.intentions.length} intentions`}</span>
    <button class="link" data-a="toggle-edit">${ui.editing ? 'Done' : 'Edit'}</button></div>`;
}

function planView(span, { next = false } = {}) {
  const hasPlan = span.intentions.length > 0;
  let h = header(next ? 'Next span' : 'New span');
  if (!hasPlan && !ui.busy) {
    h += `<div class="head fade"><div class="eyebrow">${range(span.start)}</div>
      <h1 class="display">What do the next 10&nbsp;days hold?</h1></div>`;
    h += composer('Say it like you would to a friend.');
    h += errorView();
    h += `<div class="actions"><button class="link" data-a="by-hand">Plan by hand</button></div>`;
    if (ui.editing || ui.addOpen) h += addForm();
    return h;
  }
  h += `<div class="head"><div class="eyebrow">${range(span.start)}</div></div>`;
  if (ui.busy) return h + loadingView(ui.busy);
  if (span.note) h += `<p class="note fade">${nb(span.note)}</p>`;
  if (span.question) h += `<p class="question fade">${nb(span.question)}</p>`;
  h += '<div class="section">' + editBar(span) + grid(span, { editable: true }) + '</div>';
  if (ui.editing) {
    h += '<p class="hint">Drag to move. Tap to add or remove.</p>' + addForm();
  } else {
    h += '<div class="section">' + composer(span.question ? 'Answer, or change anything' : 'Change anything') + '</div>';
    h += errorView();
    h += `<div class="actions"><button class="btn primary block" data-a="${next ? 'accept-next' : 'accept'}" ${hasPlan ? '' : 'disabled'}>${next ? 'Start next span' : 'Accept plan'}</button>
      <button class="link" data-a="start-over">Start over</button></div>`;
  }
  return h;
}

function itemsView(span, day) {
  const occ = span.occurrences.filter(o => o.day === day);
  if (!occ.length) return `<p class="empty-day">${day === 10 ? 'Review day.' : 'Nothing planned. A free&nbsp;day.'}</p>`;
  const order = new Map(span.intentions.map((it, i) => [it.id, i]));
  occ.sort((a, b) => order.get(a.intention_id) - order.get(b.intention_id));
  return '<ul class="items">' + occ.map(o => {
    const it = span.intentions.find(x => x.id === o.intention_id) || { name: o.intention_id };
    const sub = [o.detail, it.tag].filter(Boolean).join(', ');
    return `<li><button class="item${o.done ? ' done' : ''}" data-a="toggle" data-iid="${esc(o.intention_id)}" data-day="${day}" aria-pressed="${Boolean(o.done)}">
      <span class="check${it.type === 'abstain' ? ' sq' : ''}">${I.check}</span>
      <span class="txt"><span class="nm">${esc(it.name)}</span>${sub ? `<div class="dt">${esc(sub)}</div>` : ''}</span></button></li>`;
  }).join('') + '</ul>';
}

function notesField(span, day, label, placeholder) {
  return `<div class="section"><label class="label" for="note-${day}">${label}</label>
    <textarea class="field" id="note-${day}" data-note="${day}" placeholder="${esc(placeholder)}">${esc(span.notes[day] || '')}</textarea>
    <div class="saved" id="saved-${day}">Saved</div></div>`;
}

function todayView(span) {
  const n = dayNum(span);
  if (n < 1) {
    return header(range(span.start)) + `<div class="head fade"><div class="eyebrow">Starts ${fmt(span.start)}</div>
      <h1 class="display small">Your next span is&nbsp;set.</h1></div>` + grid(span, { live: false });
  }
  let h = header(`Day ${n} of 10`);
  h += `<div class="head fade"><div class="eyebrow">Today</div><h1 class="display">Day ${n}</h1><div class="sub">${fmt(todayIso())}</div></div>`;
  h += itemsView(span, n);
  h += notesField(span, n, 'Thoughts', 'Anything on your mind.');
  if (n <= 9) {
    h += '<div class="actions">';
    if (ui.busy) h += loadingView(ui.busy);
    else h += '<button class="btn" data-a="rebalance">Rebalance</button>';
    h += '</div>';
    if (ui.moved) h += `<p class="moved fade">${nb(ui.moved)}</p>${ui.undo ? '<div class="actions" style="margin-top:4px"><button class="link" data-a="undo">Undo</button></div>' : ''}`;
    h += errorView();
  }
  return h;
}

function dayView(span, d) {
  let h = header(`Day ${Math.max(1, Math.min(dayNum(span), 10))} of 10`);
  h += `<div class="head fade"><div class="eyebrow">${d === dayNum(span) ? 'Today' : d === 10 ? 'Review day' : 'Day'}</div><h1 class="display">Day ${d}</h1><div class="sub">${fmt(dayDate(span, d))}</div></div>`;
  h += itemsView(span, d);
  h += notesField(span, d, 'Notes', 'Anything worth keeping.');
  h += '<div class="actions"><button class="link" data-a="back">Back to span</button></div>';
  return h;
}

function spanView(span) {
  const n = dayNum(span);
  let h = header(n >= 1 ? `Day ${Math.min(n, 10)} of 10` : `Starts ${fmt(span.start)}`);
  h += `<div class="head fade"><div class="eyebrow">${range(span.start)}</div><h1 class="display">${completion(span)}<span style="font-size:.5em">%</span></h1><div class="sub">landed so far</div></div>`;
  h += editBar(span);
  if (!span.intentions.length && !ui.editing) h += '<p class="empty-day">Nothing planned yet.</p>';
  h += grid(span, { editable: true, live: true });
  if (ui.editing) h += '<p class="hint">Drag to move. Tap to add or remove.</p>' + addForm();
  if (n >= 10 && !ui.editing) h += '<div class="actions"><button class="btn primary" data-a="go-review">Review this span</button></div>';
  return h;
}

function reviewView(span) {
  let h = header('Day 10 of 10');
  h += `<div class="head fade"><div class="eyebrow">Review</div><h1 class="display">How it landed</h1><div class="sub">${range(span.start)}</div></div>`;
  h += '<ul class="tally">' + span.intentions.map(it => {
    const occ = occOf(span, it.id);
    return `<li><span>${esc(it.name)}</span><span class="n">${occ.filter(o => o.done).length}<small> of ${occ.length}</small></span></li>`;
  }).join('') + '</ul>';
  const notes = Object.entries(span.notes).filter(([, t]) => t && t.trim()).sort((a, b) => a[0] - b[0]);
  if (notes.length) {
    h += '<div class="section"><div class="label">Notes</div><ul class="notes-list">' +
      notes.map(([d, t]) => `<li><b>Day ${d}</b>${esc(t)}</li>`).join('') + '</ul></div>';
  }
  h += `<div class="section"><label class="label" for="reflection">Reflection</label>
    <textarea class="field" id="reflection" data-reflection placeholder="What stood out?">${esc(span.reflection || '')}</textarea>
    <div class="saved" id="saved-reflection">Saved</div></div>`;

  if (span.review) h += `<div class="section fade"><div class="label">The read</div><p class="read">${nb(span.review)}</p></div>`;

  const next = S.next;
  if (next && next.intentions.length) {
    h += `<hr class="rule"><div class="head"><div class="eyebrow">Next span · ${range(next.start)}</div></div>`;
    if (ui.busy) return h + loadingView(ui.busy);
    if (next.note) h += `<p class="note">${nb(next.note)}</p>`;
    if (next.question) h += `<p class="question">${nb(next.question)}</p>`;
    h += '<div class="section">' + editBar(next) + grid(next, { editable: true }) + '</div>';
    if (ui.editing) h += '<p class="hint">Drag to move. Tap to add or remove.</p>' + addForm();
    else {
      h += '<div class="section">' + composer('Change anything', 'msgNext') + '</div>' + errorView();
      h += '<div class="actions"><button class="btn primary block" data-a="accept-next">Start next span</button></div>';
    }
    return h;
  }
  if (ui.busy) return h + loadingView(ui.busy);
  h += errorView();
  h += `<div class="actions"><button class="btn primary block" data-a="read-span">Read my span</button>
    <button class="link" data-a="next-by-hand">Plan the next one by hand</button></div>`;
  return h;
}

function pastView() {
  let h = header('Past spans');
  h += `<div class="head fade"><div class="eyebrow">Archive</div><h1 class="display">Past</h1></div>`;
  if (!S.spans.length) return h + '<p class="empty-day">No past spans yet.</p>';
  h += '<ul class="past">' + S.spans.map((sp, i) => {
    const open = ui.openPast === sp.id;
    return `<li><button class="sum" data-a="open-past" data-id="${esc(sp.id)}" aria-expanded="${open}">
      <span><span class="ttl">Span ${S.spans.length - i}</span><br><span class="when">${range(sp.start)}</span></span>
      <span class="pct">${completion(sp)}<small style="font-size:.5em">%</small></span></button>
      ${open ? `<div class="more fade">${sp.reflection ? `<p class="pretty">${nb(sp.reflection)}</p>` : ''}${sp.review ? `<p class="read" style="font-size:18px">${nb(sp.review)}</p>` : ''}${grid(sp, {})}</div>` : ''}</li>`;
  }).join('') + '</ul>';
  return h;
}

function settingsView() {
  let h = header('Settings');
  h += `<div class="head fade"><div class="eyebrow">Your data lives on this device</div><h1 class="display">Settings</h1></div>`;
  h += '<div>';
  if (S.current) {
    h += `<div class="settings-row"><label for="startDate">Span started</label><input type="date" id="startDate" value="${S.current.start}"></div>`;
  }
  h += `<div class="settings-row"><span>Export all data</span><button class="link" data-a="export">Download</button></div>
    <div class="settings-row"><span>Import from a file</span><button class="link" data-a="import">Choose file</button></div>`;
  if (S.current) h += `<div class="settings-row"><span>Discard this span</span><button class="link" data-a="discard">Discard</button></div>`;
  h += `<div class="settings-row"><span>Lock this device</span><button class="link" data-a="lock">Lock</button></div></div>`;
  return h;
}

function loginView() {
  return `<div class="login fade"><h1 class="display">Span</h1>
    <form data-form="login"><label class="sr" for="pass">Passcode</label>
      <input class="input" id="pass" type="password" inputmode="text" autocomplete="current-password" placeholder="Passcode" required>
      <button class="btn primary block" type="submit">Enter</button>
      ${ui.error ? `<p class="error" role="alert">${esc(ui.error)}</p>` : ''}</form></div>`;
}

/* Render */

function render() {
  if (ui.locked) {
    $tabs.hidden = true;
    $app.innerHTML = loginView();
    return;
  }
  if (!S.current) S.current = newSpan(todayIso());
  const cur = S.current;
  const live = cur.status === 'live';
  let html;
  if (!live) {
    html = ui.tab === 'past' ? pastView() : ui.tab === 'settings' ? settingsView() : planView(cur);
  } else if (ui.tab === 'past') html = pastView();
  else if (ui.tab === 'settings') html = settingsView();
  else if (ui.tab === 'review') html = reviewView(cur);
  else if (ui.tab === 'span') html = ui.day ? dayView(cur, ui.day) : spanView(cur);
  else html = dayNum(cur) >= 10 ? reviewView(cur) : todayView(cur);

  const focused = document.activeElement && document.activeElement.id;
  const draft = focused ? document.getElementById(focused)?.value : null;
  $app.innerHTML = html;
  if (focused && draft != null) {
    const el = document.getElementById(focused);
    if (el && el.closest('.composer')) {
      el.value = draft;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.focus();
    }
  }
  const activeTab = ui.tab === 'review' ? 'today' : ui.tab;
  $tabs.hidden = false;
  for (const b of $tabs.querySelectorAll('button')) {
    b.toggleAttribute('aria-current', b.dataset.tab === activeTab);
    if (b.dataset.tab === activeTab) b.setAttribute('aria-current', 'page');
    b.disabled = !live && b.dataset.tab === 'span';
    b.style.opacity = b.disabled ? .35 : '';
  }
  for (const t of $app.querySelectorAll('textarea')) autosize(t);
  save();
}

function autosize(t) {
  if (!t.closest('.composer')) return;
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}

/* Claude flows */

// One shared session check. A free Render instance can take a minute to wake,
// so the first Claude call waits on this and says so.
let waking = null;
function wake() {
  if (!waking) waking = api('/api/session').then(r => { ui.awake = true; return r; }, err => { waking = null; throw err; });
  return waking;
}

async function run(label, fn) {
  ui.busy = ui.awake ? label : 'Waking up'; ui.error = ''; ui.retry = null;
  render();
  try {
    if (!ui.awake) {
      await wake();
      ui.busy = label;
      render();
    }
    await fn();
  }
  catch (err) {
    if (err.status === 401) { ui.busy = null; return; }
    ui.error = err.status === 429 ? 'Too many tries. Give it a few minutes.'
      : err.status === 503 ? 'Claude is not set up yet. You can still plan by hand.'
      : navigator.onLine === false ? 'You are offline. You can still plan by hand.'
      : 'Claude did not answer. Try again.';
    ui.retry = () => run(label, fn);
  } finally {
    ui.busy = null;
    render();
  }
}

function send(target, text) {
  const span = target === 'next' ? S.next : S.current;
  const mode = span.intentions.length ? 'refine' : 'plan';
  span.log.push({ role: 'user', text });
  run(mode === 'plan' ? 'Planning your span' : 'Updating the plan', async () => {
    const p = await askClaude(mode, span, text);
    applyPlan(span, p);
    span.log.push({ role: 'claude', text: [p.note, p.question].filter(Boolean).join(' ') });
    ui.editing = false;
  });
}

function rebalance() {
  const span = S.current;
  const before = JSON.parse(JSON.stringify({ i: span.intentions, o: span.occurrences }));
  run('Rebalancing', async () => {
    const p = await askClaude('rebalance', span, 'Rebalance what is left.');
    applyPlan(span, p);
    span.question = '';
    ui.moved = p.note || 'Rebalanced.';
    ui.undo = before;
  });
}

function readSpan() {
  const span = S.current;
  const start = addDays(span.start, 10) < todayIso() ? todayIso() : addDays(span.start, 10);
  run('Reading your span', async () => {
    const p = await askClaude('review', span, 'Review this span and draft the next one.', { start, reflection: span.reflection, log: [] });
    span.review = p.review;
    const next = newSpan(start);
    applyPlan(next, p);
    next.log.push({ role: 'claude', text: [p.note, p.question].filter(Boolean).join(' ') });
    S.next = next;
  });
}

function closeCurrent() {
  const cur = S.current;
  cur.status = 'done';
  cur.closed = todayIso();
  S.spans.unshift(cur);
}

/* Events */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    ui.tab = tab.dataset.tab; ui.day = null; ui.editing = false; ui.addOpen = false; ui.error = '';
    render(); window.scrollTo(0, 0); return;
  }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  const span = targetSpan(el);
  switch (a) {
    case 'retry': ui.retry && ui.retry(); break;
    case 'mic': listen(el); break;
    case 'by-hand': ui.editing = true; ui.addOpen = true; render(); break;
    case 'start-over':
      if (!confirm('Clear this plan and start again?')) return;
      Object.assign(span, { intentions: [], occurrences: [], log: [], note: '', question: '' });
      ui.editing = false; render(); break;
    case 'accept':
      S.current.status = 'live'; S.current.log = [];
      ui.editing = false; ui.tab = 'today'; render(); window.scrollTo(0, 0); break;
    case 'accept-next':
      closeCurrent();
      S.current = S.next; S.current.status = 'live'; S.current.log = []; S.next = null;
      ui.editing = false; ui.tab = 'today'; render(); window.scrollTo(0, 0); break;
    case 'toggle-edit': ui.editing = !ui.editing; ui.addOpen = false; render(); break;
    case 'toggle': {
      const o = findOcc(S.current, el.dataset.iid, Number(el.dataset.day));
      if (o) { o.done = !o.done; render(); }
      break;
    }
    case 'open-day': if (!ui.editing) { ui.day = Number(el.dataset.day); ui.tab = 'span'; render(); window.scrollTo(0, 0); } break;
    case 'cell': cellTap(span, el); break;
    case 'back': ui.day = null; render(); break;
    case 'remove-int':
      span.intentions = span.intentions.filter(it => it.id !== el.dataset.iid);
      span.occurrences = span.occurrences.filter(o => o.intention_id !== el.dataset.iid);
      render(); break;
    case 'add-open': ui.addOpen = true; render(); document.getElementById('addName')?.focus(); break;
    case 'add-close': ui.addOpen = false; if (!span.intentions.length) ui.editing = false; render(); break;
    case 'add-type': ui.addType = el.dataset.v; render(); break;
    case 'add-count': ui.addCount = Math.max(1, Math.min(9, ui.addCount + Number(el.dataset.v))); keepName(render); break;
    case 'rebalance': rebalance(); break;
    case 'undo':
      if (ui.undo) { S.current.intentions = ui.undo.i; S.current.occurrences = ui.undo.o; ui.undo = null; ui.moved = ''; render(); }
      break;
    case 'go-review': ui.tab = 'review'; render(); window.scrollTo(0, 0); break;
    case 'read-span': readSpan(); break;
    case 'next-by-hand': {
      const start = addDays(S.current.start, 10) < todayIso() ? todayIso() : addDays(S.current.start, 10);
      closeCurrent(); S.current = newSpan(start); S.next = null;
      ui.tab = 'today'; ui.editing = true; ui.addOpen = true; render(); window.scrollTo(0, 0); break;
    }
    case 'open-past': ui.openPast = ui.openPast === el.dataset.id ? null : el.dataset.id; render(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'discard':
      if (!confirm('Discard this span? Past spans stay.')) return;
      S.current = null; S.next = null; ui.tab = 'today'; render(); break;
    case 'lock': api('/api/logout', {}).catch(() => {}).finally(() => { ui.locked = true; ui.error = ''; render(); }); break;
  }
});

function targetSpan(el) {
  const g = el.closest('.grid');
  if (g && g.dataset.span === 'next') return S.next;
  if (ui.tab === 'review' || (S.current && S.current.status === 'live' && dayNum(S.current) >= 10 && ui.tab === 'today')) {
    if (S.next && (ui.editing || el.closest('form'))) return S.next;
  }
  return S.current;
}

function keepName(fn) {
  const v = document.getElementById('addName')?.value || '';
  fn();
  const el = document.getElementById('addName');
  if (el) el.value = v;
}

function cellTap(span, el) {
  const day = Number(el.dataset.day);
  const iid = el.dataset.iid;
  const live = span.status === 'live';
  if (!ui.editing) {
    if (live) { ui.day = day; ui.tab = 'span'; render(); window.scrollTo(0, 0); }
    return;
  }
  if (day === 10) return;
  const o = findOcc(span, iid, day);
  if (o) span.occurrences = span.occurrences.filter(x => x !== o);
  else span.occurrences.push({ intention_id: iid, day, done: false, detail: '' });
  syncTargets(span);
  render();
}

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'login') {
    const pass = document.getElementById('pass').value;
    api('/api/login', { passcode: pass })
      .then(() => { ui.locked = false; ui.error = ''; render(); })
      .catch(err => { ui.error = err.status === 429 ? 'Too many tries. Wait a bit.' : 'Wrong passcode.'; render(); });
    return;
  }
  if (kind === 'add') {
    const span = targetSpan(form);
    const name = document.getElementById('addName').value.trim();
    if (!name) return;
    let id = slug(name);
    while (span.intentions.some(it => it.id === id)) id += '_' + uid().slice(0, 2);
    const from = span.status === 'live' ? Math.max(1, dayNum(span)) : 1;
    const days = spread(ui.addCount, from);
    span.intentions.push({ id, name, type: ui.addType, tag: '', target: days.length });
    for (const d of days) span.occurrences.push({ intention_id: id, day: d, done: false, detail: '' });
    ui.addOpen = false; ui.editing = true; ui.addCount = 3;
    render();
    return;
  }
  const ta = form.querySelector('textarea');
  const text = ta.value.trim();
  if (!text || ui.busy) return;
  if (rec) { rec.stop(); rec = null; }
  ta.value = '';
  send(kind === 'msgNext' ? 'next' : 'current', text);
});

let noteTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest && t.closest('.composer')) {
    autosize(t);
    const btn = t.closest('.composer').querySelector('.send');
    if (btn) btn.disabled = !t.value.trim();
    return;
  }
  if (t.dataset && t.dataset.note) {
    const span = S.current;
    span.notes[t.dataset.note] = t.value;
    flashSaved(`saved-${t.dataset.note}`);
  } else if (t.hasAttribute && t.hasAttribute('data-reflection')) {
    S.current.reflection = t.value;
    flashSaved('saved-reflection');
  }
});

function flashSaved(id) {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    save();
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 1400);
  }, 400);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.closest && e.target.closest('.composer')) {
    e.preventDefault();
    e.target.closest('form').requestSubmit();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'startDate' && e.target.value && S.current) {
    S.current.start = e.target.value; save();
  }
  if (e.target.id === 'importFile') importData(e.target.files[0]);
});

/* Drag to move, in edit mode */

let drag = null;
document.addEventListener('pointerdown', e => {
  const dot = e.target.closest('.grid.editing .dot');
  if (!dot) return;
  e.preventDefault();
  drag = { dot, iid: dot.dataset.iid, day: Number(dot.dataset.day), x: e.clientX, y: e.clientY, moved: false, over: null, grid: dot.closest('.grid') };
  dot.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
  drag.moved = true;
  drag.dot.classList.add('dragging');
  drag.dot.style.transform = `translate(${e.clientX - drag.x}px, 0) scale(1.35)`;
  const cells = [...drag.grid.querySelectorAll(`.cell[data-iid="${CSS.escape(drag.iid)}"]`)];
  let over = null;
  for (const c of cells) {
    const r = c.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX < r.right) over = c;
  }
  if (drag.over && drag.over !== over) drag.over.classList.remove('drop');
  drag.over = over;
  if (over) over.classList.add('drop');
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  const span = d.grid.dataset.span === 'next' ? S.next : S.current;
  if (!d.moved) { cellTap(span, d.dot.closest('.cell')); return; }
  const to = d.over ? Number(d.over.dataset.day) : d.day;
  if (to !== d.day && to <= 9 && !findOcc(span, d.iid, to)) {
    const o = findOcc(span, d.iid, d.day);
    if (o) o.day = to;
  }
  render();
});
document.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });

/* Voice */

function listen(btn) {
  if (!SR) return;
  if (rec) { rec.stop(); return; }
  const ta = btn.closest('form').querySelector('textarea');
  const base = ta.value ? ta.value.trim() + ' ' : '';
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = ev => {
    let text = '';
    for (const r of ev.results) text += r[0].transcript;
    ta.value = base + text.trim();
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onend = () => { rec = null; btn.classList.remove('listening'); };
  rec.onerror = () => { rec = null; btn.classList.remove('listening'); ta.focus(); };
  btn.classList.add('listening');
  try { rec.start(); } catch { rec = null; btn.classList.remove('listening'); ta.focus(); }
}

/* Export and import */

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `span-${todayIso()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!isState(d)) throw new Error('shape');
      if (!confirm('Replace everything on this device with this file?')) return;
      S = d; ui.tab = 'today'; render();
    } catch { alert('That file is not a Span export.'); }
    document.getElementById('importFile').value = '';
  };
  r.readAsText(file);
}

/* Boot */

document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.activeElement?.matches('textarea, input')) render(); });

render();
wake().catch(() => {});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
})();
</script>
</body>
