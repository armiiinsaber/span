<style>
@font-face {
  font-family: 'Melomaniac Serif';
  src: url('/fonts/melomaniac-serif-v0.1.woff2') format('woff2');
  font-weight: 400 900;
  font-display: swap;
}
@font-face {
  font-family: 'Figtree';
  src: url('/fonts/figtree-deka.woff2') format('woff2');
  font-weight: 400 700;
  font-display: swap;
}
:root {
  --green: #B8F06E;
  --green-ink: #24350D;
  --paper: #F5F3EC;
  --paper-deep: #ECE9DF;
  --ink: #141310;
  --ink-soft: rgba(20,19,16,.76);
  --ink-faint: rgba(20,19,16,.3);
  --hairline: rgba(20,19,16,.14);
  --serif: 'Melomaniac Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Figtree', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  /* One soft tint per goal category. Chartreuse is kept for done. */
  --body: #356E51; --people: #A4472F; --fun: #8A4EA3; --work: #3B679B; --mind: #83600E; --rest: #56648A;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --pad-l: calc(16px + var(--safe-l));
  --pad-r: calc(16px + var(--safe-r));
  --tabs-h: 62px;
  /* The tab bar floats just above the home indicator; its top edge is where other floating layers start. */
  --tabs-top: calc(max(10px, var(--safe-b) - 6px) + var(--tabs-h));
  --kb: 0px;
  --dock-h: 0px;
  --tap: 44px;
  /* Glass: translucent ivory for floating layers only. Solid ivory where blur is missing. */
  --glass: var(--paper);
  --glass-edge: rgba(255,255,255,.6);
  --glass-shine: inset 0 1px 0 rgba(255,255,255,.75);
  --glass-shadow: 0 8px 28px rgba(20,19,16,.12), 0 1px 3px rgba(20,19,16,.08);
  /* Surfaces for content: solid, never glass. */
  --surface: #FCFBF7;
  --press: rgba(20,19,16,.06);
  --scrim: rgba(20,19,16,.28);
  --on-green: #141310;
  --accent-ink: #24350D;
  /* Text styles, after Apple's iOS text styles at the default size: 1rem is Body at 17 pt.
     On iOS the root follows the text size setting, so every style scales with it. Never under 11 px. */
  --t-large: 2rem; --t-title1: 1.647rem; --t-title2: 1.294rem; --t-title3: 1.176rem;
  --t-headline: 1rem; --t-body: 1rem; --t-callout: .941rem; --t-subhead: .882rem; --t-footnote: .765rem;
  --t-caption1: max(11px, .706rem); --t-caption2: max(11px, .647rem);
  /* Motion: a spring for things that move into place, and a quick ease for feedback. */
  --spring: linear(0, .009, .035 2.1%, .141 4.4%, .723 12.9%, .938 16.7%, 1.017 19.4%, 1.067, 1.089 25%, 1.088 27.5%, 1.024 36.1%, 1.002 41.6%, .993 46.6%, 1.001 63.3%, 1);
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  :root { --glass: rgba(245,243,236,.72); }
}
/* Dark: a warm near black under ivory text, the tints lifted, chartreuse still means done. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14130F; --paper-deep: #24221D; --surface: #1C1B17;
    --ink: #F5F3EC; --ink-soft: rgba(245,243,236,.7); --ink-faint: rgba(245,243,236,.34); --hairline: rgba(245,243,236,.16);
    --press: rgba(245,243,236,.08); --scrim: rgba(0,0,0,.5); --accent-ink: #B8F06E;
    --body: #7FC19C; --people: #F0947B; --fun: #CFA3E6; --work: #92B8EA; --mind: #DDB866; --rest: #AAB6DA;
    --glass: #1C1B17; --glass-edge: rgba(255,255,255,.1); --glass-shine: inset 0 1px 0 rgba(255,255,255,.08);
    --glass-shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    :root { --glass: rgba(34,32,27,.7); }
  }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --glass: var(--surface); }
}
/* Follow the iOS text size setting. Everything below is sized in rem. */
html { font-size: 106.25%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--paper); overflow-x: clip; }
body {
  margin: 0; min-height: 100dvh; overflow-x: clip;
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: var(--t-callout); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--green); color: var(--on-green); }
h1, h2, h3 { text-wrap: balance; font-weight: 400; margin: 0; }
p, li, .pretty { text-wrap: pretty; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; background: none; border: 0; padding: 0; }
/* Chrome of the app is not selectable; notes and messages are. */
button, header, nav, .eyebrow, .label, .tile, .toast, .sheet-handle { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-shine), 0 0 0 .5px var(--hairline);
}
@media (prefers-reduced-transparency: reduce) {
  .glass { -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* The mark. Ten dots, day 1 to day 10, along the spiral. */
.mk { display: inline-block; flex: none; fill: currentColor; color: var(--ink); overflow: visible; vertical-align: middle; }
.mk circle { transform-box: fill-box; transform-origin: center; }
.mk-inline { width: 18px; height: 18px; margin-left: 4px; position: relative; top: -1px; }
.mk-header { width: 24px; height: 24px; }
.mk-medium { width: 48px; height: 48px; }
.mk-large { width: 88px; height: 88px; }
/* Living: a wave runs from dot 1 to dot 10, each dot swelling and easing along the spiral. */
.mk.live circle { animation: wave 1.6s cubic-bezier(.45,.05,.35,1) infinite; animation-delay: calc(var(--i) * .16s); }
@keyframes wave {
  0% { transform: none; }
  14% { transform: translate(var(--tx), var(--ty)) scale(1.24); }
  34%, 100% { transform: none; }
}
.mk.out { opacity: 0; transition: opacity .5s var(--ease); }
.waiting { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 36px 0 8px; text-align: center; }
.waiting p { margin: 0; color: var(--ink-soft); font-size: var(--t-subhead); }

/* Header */
/* A static header: it scrolls away with the page. Fixed headers near the notch drift on iPhone. */
.bar {
  position: relative; z-index: 20;
  padding: calc(var(--safe-t) + 4px) var(--pad-r) 4px var(--pad-l);
  background: var(--paper);
}
.bar-in { width: 100%; max-width: 620px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); }
.brand { display: inline-flex; align-items: center; gap: 8px; }
.mark { font-family: var(--serif); font-size: 1.45rem; line-height: 1; letter-spacing: -.01em; position: relative; top: 1px; }
.icon-btn { min-width: var(--tap); min-height: var(--tap); display: inline-grid; place-items: center; border-radius: 50%; color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--press); }
/* Every control answers a touch at once. */
.link:active, .menu button:active, .day .dl:active, .chip:active, .pick button:active, .icons button:active, .sum:active { background: var(--press); }
button.strip10:active { background: var(--press); }
.link, .menu button, .day .dl, .chip, .sum { transition: background .15s var(--ease); border-radius: 12px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--tap); padding-right: 12px; margin-left: -8px; font-size: var(--t-callout); }
.back svg { width: 24px; height: 24px; }

/* Main */
main {
  max-width: 620px; margin: 0 auto;
  padding: 8px var(--pad-r) calc(var(--tabs-top) + var(--dock-h) + 40px) var(--pad-l);
}
main:focus { outline: none; }
body.no-tabs main { padding-bottom: calc(var(--safe-b) + 40px); }
/* While a toast is up, the page makes room so it never covers the newest card. */
body.toasting main { padding-bottom: calc(var(--tabs-top) + var(--dock-h) + 108px); }

.eyebrow { font-size: var(--t-footnote); font-weight: 600; color: var(--ink-soft); }
.head { text-align: center; margin: 16px 0 28px; }
.head .eyebrow { margin-bottom: 12px; }
.display {
  /* Grows with the iOS text size but never wider than the screen allows. */
  font-size: var(--t-large); font-weight: 600;
  line-height: 1.02; letter-spacing: -.025em; overflow-wrap: break-word;
}
.display.small { font-size: var(--t-title1); line-height: 1.05; }
.display small { font-size: .5em; }
.sub { margin: 12px 0 0; font-size: var(--t-subhead); color: var(--ink-soft); }
.lede { margin: 14px auto 0; max-width: 30ch; font-size: var(--t-body); color: var(--ink-soft); }
.label { display: block; font-size: var(--t-footnote); font-weight: 600; color: var(--ink-soft); margin: 0 0 10px; }
.section { margin-top: 32px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: 14px;
  background: var(--press); color: var(--ink);
  font-size: var(--t-body); font-weight: 600;
  transition: background .2s var(--ease), transform .25s var(--spring);
}
.btn:active { background: var(--hairline); transform: scale(.97); }
.btn.primary { background: var(--green); color: var(--on-green); }
.btn.primary:active { background: color-mix(in srgb, var(--green) 86%, #000); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: default; }
.link {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); min-width: var(--tap); padding: 0 8px;
  font-size: var(--t-subhead); color: var(--ink-soft);
  text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 5px;
}
.link:active { color: var(--accent-ink); }
.link.danger { color: var(--ink); }
.actions { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 24px; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; max-width: 82%; }
.bubble {
  background: var(--paper-deep); border-radius: 20px 20px 6px 20px; padding: 10px 15px;
  font-size: var(--t-body); line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  -webkit-user-select: text; user-select: text;
}
.msg-state { margin-top: 4px; font-size: var(--t-caption1); color: var(--ink-soft); text-align: right; }
.msg.deka { align-self: stretch; }
.say { font-size: var(--t-body); line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; margin: 0; -webkit-user-select: text; user-select: text; }
.say .waking { color: var(--ink-soft); font-size: var(--t-subhead); margin-left: 6px; }
.msg-error { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--t-subhead); }
.chat-empty { text-align: center; padding: 40px 0 16px; }
.chat-empty .mk { margin-bottom: 18px; }
.day-sep { text-align: center; font-size: var(--t-footnote); font-weight: 600; color: var(--ink-soft); padding: 4px 0; }

/* Cards in the chat */
/* Cards are content: a solid surface, never glass. */
.card { margin-top: 12px; border-radius: 18px; padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--hairline); }
.card .eyebrow { display: block; margin-bottom: 8px; }
.card ul { list-style: none; margin: 0; padding: 0; }
.card .lines li { position: relative; padding: 3px 0 3px 16px; font-size: var(--t-subhead); }
.card .lines li::before { content: ''; position: absolute; left: 1px; top: .78em; width: 6px; height: 6px; border-radius: 50%; border: 1.25px solid var(--ink); }
.card .row { display: flex; gap: 8px; margin-top: 12px; }
.card .row .btn { flex: 1; }
.card .state { margin-top: 10px; font-size: var(--t-footnote); color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.card .state svg { width: 14px; height: 14px; }
.card.quiet { opacity: .72; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: var(--tap); padding: 0 14px; border-radius: 22px; border: 1px solid var(--hairline);
  display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-subhead);
}
.chip i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
.chip.done i { background: var(--green); }
.chip.missed { color: var(--ink-soft); }
.chip.missed i { border-color: var(--ink-faint); }

/* Sessions: every goal has an icon, outlined in its category tint. Done fills with
   chartreuse, missed fades, not confirmed keeps a dashed outline. Hold back goals are squarer. */
.c-body { --c: var(--body); } .c-people { --c: var(--people); } .c-fun { --c: var(--fun); }
.c-work { --c: var(--work); } .c-mind { --c: var(--mind); } .c-rest { --c: var(--rest); }
.s {
  --z: 22px; position: relative; flex: none; display: inline-grid; place-items: center;
  width: var(--z); height: var(--z); border-radius: 50%; border: 1.5px solid transparent;
  color: var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 11%, var(--paper));
  transition: background .35s var(--ease), color .35s var(--ease), opacity .35s var(--ease);
}
.s svg { width: 66%; height: 66%; fill: currentColor; }
.s.sq { border-radius: 30%; }
.s.done { background: var(--green); color: var(--on-green); }
.s.missed { opacity: .32; background: transparent; border-color: var(--hairline); }
.s.unsure { background: transparent; border-style: dashed; border-color: var(--ink-faint); }
.s.changed::after { content: ''; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid var(--green); }
button.s:active { transform: scale(.94); }
.s.pop { animation: pop .45s var(--ease); }
.s.enter { animation: enter .3s var(--ease) both; animation-delay: var(--dl, 0ms); }
@keyframes enter { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
.burst { position: absolute; inset: 0; pointer-events: none; }
.burst i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--green); animation: burst .6s var(--ease) forwards; }
.burst i:nth-child(even) { background: var(--c, var(--ink)); width: 4px; height: 4px; margin: -2px; }
@keyframes burst { from { transform: none; opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }

/* The ten day strip, compact: one column per day, used in the chat. */
.strip10 { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; margin: 2px -6px 0; width: calc(100% + 12px); border-radius: 12px; }
button.strip10 { text-align: inherit; }
.dayopen .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px -8px 2px 0; }
.dayopen .top .icon-btn svg { width: 20px; height: 20px; }
.strip10 .col { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 64px; padding: 6px 0 8px; border-radius: 10px; transition: background .3s var(--ease); }
.strip10 .dn { font-size: var(--t-caption2); line-height: 1.3; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.strip10 .col.today { background: color-mix(in srgb, var(--green) 38%, transparent); }
.strip10 .col.today .dn { color: var(--ink); font-weight: 600; }
.strip10 .col.past .s { opacity: .7; }
.strip10 .col.open { background: var(--paper-deep); }
.strip10 .col.open .dn { color: var(--ink); font-weight: 600; }
.strip10 .s { --z: 21px; }
.rvdot { display: block; flex: none; width: 16px; height: 16px; margin-top: 4px; border-radius: 50%; border: 1.5px solid var(--ink); }
.dayopen { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--paper-deep); }
.dayopen .h { font-size: var(--t-footnote); font-weight: 600; margin: 0 0 4px; }
.dayopen ul li { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: var(--t-subhead); }
.dayopen .none { margin: 0; font-size: var(--t-subhead); color: var(--ink-soft); }
.card .summary { margin: 10px 0 0; font-size: var(--t-subhead); }

/* The ten day strip, mini: where we are. Dots grow from day 1 to day 10, like the mark. */
.mini { display: inline-flex; align-items: center; gap: 5px; }
.mini i { flex: none; width: var(--d); height: var(--d); border-radius: 50%; border: 1.5px solid var(--ink-faint); }
.mini i.past { background: var(--ink); border-color: var(--ink); }
.mini i.today { background: var(--green); border-color: var(--ink); }

/* The ten day strip, full: the Days tab, one row per day. */
.days { list-style: none; margin: 0; padding: 0; }
.day { position: relative; isolation: isolate; display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--hairline); }
.day::before { content: ''; position: absolute; inset: 3px -8px; border-radius: 14px; background: transparent; z-index: -1; transition: background .3s var(--ease); }
.day.today::before { background: color-mix(in srgb, var(--green) 30%, transparent); }
.day.drop::before { background: var(--paper-deep); }
.day.flash::before { animation: flash 1.8s var(--ease) 2; }
@keyframes flash { 0%, 100% { background: transparent; } 35% { background: color-mix(in srgb, var(--green) 55%, transparent); } }
.day .dl { flex: none; width: 60px; min-height: 48px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 4px; border-radius: 12px; text-align: left; }
.day .dn { font-size: var(--t-title2); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.day .dd { font-size: var(--t-caption2); color: var(--ink-soft); margin-top: 4px; white-space: nowrap; }
.day.past .dn { color: var(--ink-soft); }
.day .ss { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.day .s { --z: max(44px, 2.6rem); }
.day .s svg { width: 54%; height: 54%; }
.day .free { font-size: var(--t-subhead); color: var(--ink-soft); }
.day.review .rvdot { width: 26px; height: 26px; margin: 0 9px; }
.day.review .free { color: var(--ink); }
.s.dragging { transform: scale(1.12); z-index: 2; }

/* Goals */
.goals { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.goal { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 10px 0; border-bottom: 1px solid var(--hairline); text-align: left; }
button.goal:active { background: var(--press); }
.goal .s { --z: 42px; }
.goal .gn { flex: 1; min-width: 0; }
.goal .gn b { display: block; font-size: var(--t-body); font-weight: 500; line-height: 1.3; }
.goal .gn span { display: block; font-size: var(--t-footnote); color: var(--ink-soft); }
.ring { flex: none; width: 36px; height: 36px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.5; }
.ring .bg { stroke: var(--hairline); }
.ring .fg { stroke: var(--accent-ink); stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.goal .ring { width: 30px; height: 30px; }

/* Where we are: the status card under a reply. */
.status .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.status .dayn { font-size: var(--t-body); font-weight: 600; }
.status .gl { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.status .gl li { position: relative; width: 42px; height: 42px; display: grid; place-items: center; }
.status .gl .ring { position: absolute; inset: 0; width: 42px; height: 42px; }
.status .gl .ring .fg { stroke: var(--ink); }
.status .gl .s { --z: 30px; }
.status .gl .s.full { background: var(--green); color: var(--on-green); }

/* Icon picker in the goal sheet */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
.icons button { height: 48px; border-radius: 12px; display: grid; place-items: center; }
.icons button[aria-pressed="true"] { background: var(--paper-deep); box-shadow: inset 0 0 0 1.5px var(--ink); }
.icons .s { --z: 32px; }
.icon-row { display: flex; align-items: center; gap: 12px; }
.icon-row .s { --z: 44px; }

/* Checklist */
.items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.item { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 64px; padding: 12px 0; border-bottom: 1px solid var(--hairline); text-align: left; }
.check { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; transition: background .3s var(--ease); }
.check.sq { border-radius: 5px; }
.check svg { width: 15px; height: 15px; opacity: 0; transition: opacity .2s var(--ease); }
.item.done .check { background: var(--green); }
.item.done .check svg { opacity: 1; }
.item.unconfirmed .check { border-style: dashed; border-color: var(--ink-faint); }
.item.missed .nm { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.item.pop .check { animation: pop .45s var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
.item .txt { flex: 1; min-width: 0; }
.item .s { --z: 38px; }
.item .nm { display: block; font-size: var(--t-body); line-height: 1.3; }
.item.done .nm { color: var(--ink-soft); }
.item .dt { display: block; font-size: var(--t-footnote); color: var(--ink-soft); margin-top: 2px; }
.empty { text-align: center; padding: 8px 0; }
.empty .lede { margin-top: 12px; }
.quiet { text-align: center; color: var(--ink-soft); font-size: var(--t-subhead); padding: 20px 0; margin: 0; }

.field {
  display: block; width: 100%; resize: none; min-height: 6.5rem;
  border: 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); border-radius: 0;
  background: transparent; padding: 14px 0; font-size: var(--t-body); line-height: 1.55;
  -webkit-user-select: text; user-select: text;
}
.field:focus { outline: none; border-color: var(--ink); }
.field::placeholder, .input::placeholder, .dock textarea::placeholder { color: var(--ink-soft); opacity: 1; }
.saved { font-size: var(--t-caption1); color: var(--ink-soft); text-align: right; min-height: 1.2em; margin-top: 6px; opacity: 0; transition: opacity .6s var(--ease); }
.saved.on { opacity: 1; }

/* Past and settings */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.list > li { border-bottom: 1px solid var(--hairline); }
.list .sum { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; padding: 12px 0; text-align: left; }
.list .pct { font-size: var(--t-title1); font-weight: 600; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.list .when { display: block; font-size: var(--t-footnote); color: var(--ink-soft); }
.list .ttl { display: block; font-size: var(--t-body); }
.list .more { padding: 0 0 24px; }
.list .more p { margin: 0 0 16px; }
.read { font-size: var(--t-body); line-height: 1.5; }
.setting { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 16px; min-height: 60px; padding: 8px 0; }
.setting > * { white-space: nowrap; }
.setting input[type="date"], .setting input[type="time"] { min-height: var(--tap); border: 0; background: none; font-size: var(--t-body); text-align: right; color: var(--ink); }

/* Login and intro */
.center { min-height: calc(100dvh - var(--safe-t) - var(--safe-b) - 120px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.login .mk { margin-bottom: 22px; }
.login .display { font-size: calc(var(--t-large) * 1.5); margin-bottom: 32px; }
.login form { display: grid; gap: 16px; max-width: 300px; margin: 0 auto; width: 100%; }
.input {
  width: 100%; min-height: var(--tap); border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent;
  padding: 10px 0; font-size: var(--t-body);
}
.input:focus { outline: none; border-bottom-width: 2px; padding-bottom: 9px; }
.login .input { text-align: center; letter-spacing: .2em; }
.login .hint { margin: 4px 0 0; font-size: var(--t-subhead); color: var(--ink-soft); }
.intro .mk { margin-bottom: 26px; }
.intro .display { margin: 14px 0 18px; }
.intro .lede { margin-bottom: 36px; }
.intro .actions { width: 100%; }

/* Composer: floats above the tabs, and above the keyboard while typing */
.dock {
  position: fixed; z-index: 25; left: var(--pad-l); right: var(--pad-r);
  bottom: calc(var(--tabs-top) + 8px);
  max-width: 620px; margin: 0 auto;
  border-radius: 26px; padding: 4px 4px 4px 16px;
  box-shadow: var(--glass-shine), var(--glass-shadow);
}
body.kb .dock { bottom: calc(var(--kb) + 8px); }
.dock-in { display: flex; align-items: flex-end; gap: 4px; }
.dock textarea {
  flex: 1; min-width: 0; resize: none; max-height: 9.5rem; overflow-y: auto;
  border: 0; background: transparent; padding: 10px 0; min-height: var(--tap);
  font-family: var(--sans); font-size: var(--t-body); line-height: 1.4;
  -webkit-user-select: text; user-select: text;
}
.dock textarea:focus { outline: none; }
.dock .send { background: var(--ink); color: var(--paper); }
.dock .send[disabled] { background: transparent; color: var(--ink-soft); }
.dock .icon-btn svg { width: 20px; height: 20px; }
.dock .listening { background: var(--paper-deep); animation: breathe 1.6s var(--ease) infinite alternate; }
.dock .offline { margin: 6px 0 0; font-size: var(--t-footnote); color: var(--ink-soft); }
@keyframes breathe { from { box-shadow: 0 0 0 0 var(--hairline); } to { box-shadow: 0 0 0 8px transparent; } }

/* Tabs */
/* Tabs: a floating capsule of Liquid Glass above the content, the selected tab under a clear lens. */
nav.tabs {
  position: fixed; z-index: 30; left: var(--pad-l); right: var(--pad-r); bottom: max(10px, calc(var(--safe-b) - 6px));
  max-width: 440px; margin: 0 auto; height: var(--tabs-h); padding: 4px; border-radius: 31px;
  box-shadow: var(--glass-shine), var(--glass-shadow);
}
body.kb nav.tabs, body.no-tabs nav.tabs, body.no-tabs .dock { display: none; }
nav.tabs .in { height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
nav.tabs button { position: relative; height: 100%; border-radius: 27px; display: grid; place-items: center; color: var(--ink-soft); transition: color .3s var(--ease), background .35s var(--spring), transform .3s var(--spring); }
nav.tabs button:active { transform: scale(.94); }
nav.tabs button[aria-current="page"] { background: var(--press); }
nav.tabs button svg { width: 1.6rem; height: 1.6rem; }
nav.tabs button .mk { width: 1.5rem; height: 1.5rem; color: currentColor; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"]::after { content: ''; position: absolute; bottom: 5px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 1px var(--ink); }

/* Toast */
.toast {
  position: fixed; z-index: 40; left: var(--pad-l); right: var(--pad-r);
  bottom: calc(var(--tabs-top) + var(--dock-h) + 16px);
  max-width: 588px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 52px; padding: 4px 6px 4px 20px; border-radius: 26px;
  color: var(--ink); font-size: var(--t-subhead);
  animation: rise .35s var(--ease) both;
}
body.no-tabs .toast { bottom: calc(var(--safe-b) + 16px); }
.toast button { min-height: var(--tap); padding: 0 14px; border-radius: 22px; color: var(--accent-ink); font-weight: 600; font-size: var(--t-body); }
.toast button:active { background: var(--press); }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); animation: fade .3s var(--ease) both; }
.sheet {
  position: fixed; left: 0; right: 0; z-index: 51; bottom: var(--kb);
  max-height: calc(100dvh - var(--safe-t) - 12px - var(--kb)); overflow-y: auto; overscroll-behavior: contain;
  border-radius: 28px 28px 0 0; border-bottom: 0;
  padding: 0 var(--pad-r) calc(var(--safe-b) + 16px) var(--pad-l);
  box-shadow: var(--glass-shine), var(--glass-shadow);
  animation: up .5s var(--spring) both;
  transition: max-height .5s var(--spring), transform .45s var(--spring);
}
/* Detents: a tall sheet opens at medium and drags up to large. Short and medium sheets float inset
   from the screen edges on glass; at large the sheet meets the edges and turns more opaque. */
.sheet.medium { max-height: min(60dvh, calc(100dvh - var(--safe-t) - 12px - var(--kb))); }
.sheet:not(.large) { left: 8px; right: 8px; bottom: calc(var(--kb) + max(8px, var(--safe-b) - 20px)); border-radius: 32px; border-bottom: 1px solid var(--glass-edge); padding-bottom: 16px; }
.sheet.large { background: var(--surface); }
.sheet.dragging { transition: none; }
.sheet-in { max-width: 620px; margin: 0 auto; }
.sheet-handle { display: flex; justify-content: center; align-items: center; height: 24px; cursor: grab; touch-action: none; }
.sheet-top { touch-action: none; }
.sheet-handle::before { content: ''; width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sheet h2 { font-size: var(--t-title2); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.sheet h2:focus { outline: none; }
.sheet h2 .sheet-sub { display: block; font-size: var(--t-footnote); font-weight: 400; color: var(--ink-soft); margin-top: 2px; letter-spacing: 0; }
.sheet .form { display: grid; gap: 18px; padding-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); border: 1px solid var(--ink); border-radius: 2px; }
.seg button { min-height: var(--tap); font-size: var(--t-subhead); font-weight: 600; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stepper { display: flex; align-items: center; justify-content: space-between; }
.stepper .ctl { display: flex; align-items: center; gap: 10px; }
.stepper .val { font-size: var(--t-title2); font-weight: 600; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .icon-btn { border: 1px solid var(--ink); font-size: var(--t-title3); }
.stepper .icon-btn[disabled] { opacity: .3; }
.pick { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick button, .pick .rvd {
  width: 100%; min-height: 74px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid var(--hairline); border-radius: 2px;
}
.pick .pn { font-size: var(--t-body); font-weight: 600; line-height: 1; }
.pick .pd { font-size: var(--t-caption2); color: var(--ink-soft); }
.pick .dot { width: 11px; height: 11px; }
.pick .dot.empty { border-color: transparent; }
.pick button.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick button.sel .pd { color: var(--paper); opacity: .8; }
.pick button.sel .dot { border-color: var(--paper); }
.pick .rvd { background: var(--paper-deep); border-color: transparent; color: var(--ink-soft); font-size: var(--t-caption2); }
.pick-hint { margin: 10px 0 0; font-size: var(--t-subhead); color: var(--ink-soft); min-height: 1.4em; text-align: center; }
.menu { list-style: none; margin: 0 0 8px; padding: 0; border-top: 1px solid var(--hairline); }
.menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; min-height: 60px; font-size: var(--t-body); border-bottom: 1px solid var(--hairline); text-align: left; }
.menu svg { width: 18px; height: 18px; color: var(--ink-soft); }

.fade { animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  /* Things that would slide in fade in instead. */
  .sheet, .scrim, .toast, .fade { animation: fade .25s ease-out both !important; }
  :root { --spring: ease-out; }
  /* The mark stays still and breathes instead of moving. */
  .mk.live { animation: breathe-mark 2s ease-in-out infinite alternate !important; }
  .mk.live circle { animation: none !important; }
}
@keyframes breathe-mark { from { opacity: 1; } to { opacity: .45; } }
</style>

"no","any","no"],"puzzle":["mind","light","no","no","any","no"],"target":["mind","light","no","no","any","no"],"moon":["rest","light","no","no","evening","no"],"bed":["rest","light","no","no","evening","no"],"meditate":["rest","light","no","no","morning","no"],"leaf":["rest","light","no","no","any","no"],"plant":["rest","light","no","no","any","no"],"sun":["rest","light","no","no","morning","no"],"phone_off":["rest","light","no","no","any","no"]};

/* End icon list */

const GUESS = [[/run|jog/, 'run'], [/gym|lift|weights/, 'gym'], [/walk/, 'walk'], [/yoga|stretch|pilates/, 'yoga'], [/bike|cycl/, 'bike'], [/swim/, 'swim'], [/hike/, 'hike'],

  [/friend|mates/, 'friends'], [/coffee|cafe/, 'coffee'], [/call/, 'call'], [/music|song|produc/, 'music'], [/guitar/, 'guitar'], [/sober|sleep|dry/, 'moon'], [/read|book/, 'book'],
  [/writ|journal/, 'write'], [/medita|breath/, 'meditate'], [/cook|meal/, 'cook'], [/clean|tidy/, 'clean'], [/code|coding/, 'code'], [/study|learn|course|class/, 'learn'],

  [/film|movie/, 'movie'], [/paint|draw|art/, 'art'], [/work|project|letter|startup|side/, 'laptop']];
function guessIcon(name, type) {
  const n = String(name || '').toLowerCase();
  const hit = GUESS.find(([re]) => re.test(n));
  return hit ? hit[1] : type === 'abstain' ? 'moon' : type === 'see' ? 'friends' : 'sparkle';
}
const iconOf = it => (it && GOAL_ICONS[it.icon] ? it.icon : guessIcon(it && it.name, it && it.type));
const catOf = it => (it && CATEGORIES.includes(it.category) ? it.category : GOAL_ICONS[iconOf(it)][0]);

/* Storage */

// Data saved before the rename lives under the old key. It is copied to the
// new key once and left in place, so it stays readable.
const KEY = 'deka.v1';
const OLD_KEY = 'span.v1';
const blank = () => ({ v: 1, current: null, next: null, spans: [] });
let S = migrate(load());

function load() {
  try {
    let raw = localStorage.getItem(KEY);
    if (!raw) {
      raw = localStorage.getItem(OLD_KEY);
      if (raw) localStorage.setItem(KEY, raw);
    }
    if (!raw) return blank();
    const d = JSON.parse(raw);
    return isState(d) ? d : blank();
  } catch { return blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}
// Paint first, write after.
let saveTimer = null;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 0); }
function isState(d) {
  return d && typeof d === 'object' && d.v === 1 && Array.isArray(d.spans);
}
// Brings any saved data or older export up to date. Nothing is removed: the old
// planning log is kept and also turned into the start of the chat thread.
function migrate(d) {
  d.settings = { checkin: '20:00', ...(d.settings || {}) };
  for (const sp of [d.current, d.next, ...d.spans]) {
    if (!sp) continue;
    if (!Array.isArray(sp.chat)) sp.chat = (sp.log || []).filter(l => l && l.text).map(l => ({ id: uid(), role: l.role === 'user' ? 'user' : 'deka', text: l.text, ts: 0 }));
    sp.summary = sp.summary || '';
    sp.summarizedUpTo = sp.summarizedUpTo || 0;
    sp.checked = Array.isArray(sp.checked) ? sp.checked : [];
    sp.checkin = sp.checkin || {};
    sp.notes = sp.notes || {};
    sp.intentions = sp.intentions || [];
    sp.occurrences = sp.occurrences || [];
    for (const it of sp.intentions) if (!GOAL_ICONS[it.icon]) { it.icon = guessIcon(it.name, it.type); it.category = GOAL_ICONS[it.icon][0]; }
  }
  if (!d.seen && (d.spans.length || (d.current && d.current.intentions.length))) d.seen = true;
  return d;
}

/* Dates. The UI never names weekdays; Deka gets them. */

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayIso = () => iso(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmt = s => { const d = parse(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const range = start => `${fmt(start)} to ${fmt(addDays(start, 9))}`;
const dayDate = (span, n) => addDays(span.start, n - 1);
const dayNum = span => diffDays(span.start, todayIso()) + 1;
function dayMap(start) {
  return Array.from({ length: 10 }, (_, i) => {
    const date = addDays(start, i);
    return { day: i + 1, date, weekday: WEEKDAYS[parse(date).getDay()] };
  });
}

/* Helpers */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Glue the last two words so a line never ends on a lone word.
const nb = s => esc(s).replace(/ (\S+)$/, '&nbsp;$1');
const nbRaw = s => String(s).replace(/ (\S+)$/, ' $1');
function uid() { return Math.random().toString(36).slice(2, 9); }
const slug = s => (s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'item').slice(0, 24);
const clone = o => JSON.parse(JSON.stringify(o));

function newSpan(start) {
  return { id: uid(), start, status: 'planning', intentions: [], occurrences: [], notes: {}, log: [], chat: [], summary: '', summarizedUpTo: 0, checked: [], checkin: {}, note: '', question: '', reflection: '', review: '' };
}
const occOf = (span, iid) => span.occurrences.filter(o => o.intention_id === iid);
const findOcc = (span, iid, day) => span.occurrences.find(o => o.intention_id === iid && o.day === day);
const nameOf = (span, iid) => (span.intentions.find(i => i.id === iid) || { name: iid }).name;
const statusOf = o => o.done ? 'done' : o.missed ? 'missed' : 'planned';
// A session on a day that has passed that nobody has marked done or missed yet.
const unconfirmed = (span, o) => isLive(span) && !o.done && !o.missed && o.day < dayNum(span);
const doneOf = (span, iid) => occOf(span, iid).filter(o => o.done).length;
const plannedOf = (span, iid) => occOf(span, iid).filter(o => !o.done && !o.missed).length;
// The free day with the lightest load, as far as possible from the goal's other days.
function bestFreeDay(span, taken, from) {
  let best = null, bestScore = -Infinity;
  for (let d = Math.max(1, from); d <= 9; d++) {
    if (taken.includes(d)) continue;
    const load = span.occurrences.filter(o => o.day === d).length;
    const gap = taken.length ? Math.min(...taken.map(t => Math.abs(t - d))) : 5;
    const score = gap * 2 - load;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}
function spread(n, from = 1) {
  const days = [];
  for (let d = Math.max(1, from); d <= 9; d++) days.push(d);
  if (n >= days.length) return days;
  return Array.from({ length: n }, (_, i) => days[Math.floor((i + .5) * days.length / n)]);
}
const isLive = span => span && span.status === 'live';
const openFrom = span => isLive(span) ? Math.min(9, Math.max(1, dayNum(span))) : 1;
function summary(span) {
  const parts = span.intentions.map(it => `${it.name} ${doneOf(span, it.id)}/${it.target}`);
  const bits = [`Deka ${range(span.start)}: ${parts.join(', ') || 'nothing planned'}.`];
  if (span.reflection) bits.push(`Their reflection: ${span.reflection}`);
  if (span.review) bits.push(`Your read: ${span.review}`);
  return bits.join(' ');
}
function completion(span) {
  const want = span.intentions.reduce((n, it) => n + (it.target || 0), 0);
  const done = span.occurrences.filter(o => o.done).length;
  return want ? Math.min(100, Math.round(100 * done / want)) : 0;
}
const spanFor = t => t === 'next' ? S.next : S.current;
const nextStart = () => { const s = addDays(S.current.start, 10); return s < todayIso() ? todayIso() : s; };
// Where a conversation with Deka stands.
function phase() {
  const cur = S.current;
  if (!isLive(cur)) return 'planning';
  return dayNum(cur) >= 10 ? 'review' : 'live';
}
// The deka the goals and schedule talk is about: the next one during the review.
const goalTarget = () => phase() === 'review' ? 'next' : 'current';

/* The mark */

const DOTS = [[360.86,451.08,31.13],[289.21,407.04,37.67],[250.25,312.85,45.67],[279.38,192.66,55.3],[393.4,95.44,67.07],[574.37,81.44,81.28],[762,196.59,98.57],[864,443.32,119.41],[788.26,757.94,144.73],[489.61,1012.44,175.41]];
// Each dot eases a little along the spiral: toward the next dot, by a share of its size.
const MARK_BODY = DOTS.map(([x, y, r], i) => {
  const a = DOTS[Math.max(0, i - 1)], b = DOTS[Math.min(9, i + 1)];
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  const tx = ((b[0] - a[0]) / len * r * .3).toFixed(1), ty = ((b[1] - a[1]) / len * r * .3).toFixed(1);
  return `<circle data-day="${i + 1}" cx="${x}" cy="${y}" r="${r}" style="--i:${i};--tx:${tx}px;--ty:${ty}px"/>`;

function mark(size, live = false) {
  return `<svg class="mk mk-${size}${live ? ' live' : ''}" viewBox="0 0 1188 1188" aria-hidden="true" focusable="false">${MARK_BODY}</svg>`;
}
// Stops a living mark: each dot finishes its wave quickly and settles, then the mark fades.
function settleMark(el, { fade = true } = {}) {
  if (!el || !el.classList.contains('live')) return;
  const anims = el.getAnimations ? el.getAnimations({ subtree: true }) : [];
  let wait = 0;
  for (const a of anims) {
    const t = a.effect && a.effect.getComputedTiming();
    if (!t || t.currentIteration == null) continue;

    a.playbackRate = 3;

/* API */

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { ui.locked = true; render(); }
  if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
  return data;
}

/* Pieces: one visual language. Every session is its goal's icon on one of ten days. */

const iconLabel = k => k.replace('_', ' ');
// small: the bold weight, so a small icon holds the same weight as the text beside it.
function sIcon(it, { tag = 'span', cls = '', attrs = '', small = false } = {}) {
  return `<${tag} class="s c-${catOf(it)}${it.type === 'abstain' ? ' sq' : ''}${cls}"${attrs ? ` ${attrs}` : ''}><svg aria-hidden="true" focusable="false"><use href="#${small ? 'ib' : 'i'}-${iconOf(it)}"/></svg></${tag}>`;
}
const stateOf = (span, o) => o.done ? 'done' : o.missed ? 'missed' : unconfirmed(span, o) ? 'unsure' : 'planned';
const STATE_WORD = { done: 'done', missed: 'missed', unsure: 'not confirmed', planned: 'planned' };
const byGoal = span => { const order = new Map(span.intentions.map((it, i) => [it.id, i])); return (a, b) => (order.get(a) ?? 99) - (order.get(b) ?? 99); };

// A progress ring, done out of target.
function ring(done, target) {
  const c = 2 * Math.PI * 15.5, f = Math.min(1, target ? done / target : 0);
  return `<svg class="ring" viewBox="0 0 36 36" aria-hidden="true" focusable="false"><circle class="bg" cx="18" cy="18" r="15.5"/>${f ? `<circle class="fg" cx="18" cy="18" r="15.5" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - f)).toFixed(2)}"/>` : ''}</svg>`;
}

// Mini: ten dots, filled as days pass. They grow toward day 10, like the mark.
function mini(today) {
  let h = `<span class="mini" role="img" aria-label="${today ? `Day ${Math.min(today, 10)} of 10` : 'Not started yet'}">`;
  for (let d = 1; d <= 10; d++) h += `<i class="${d < today ? 'past' : d === today ? 'today' : ''}" style="--d:${6 + Math.round((d - 1) * 8 / 9)}px"></i>`;
  return h + '</span>';
}

// Compact: one column per day. sessions: [{ it, day, state, changed, from }].
// On a plan card the whole strip is one button, so the target stays large: a tap opens the day under it.
function stripCompact(sessions, { today = 0, open = null, tap = null, sort } = {}) {
  let h = tap ? `<button class="strip10" ${tap} aria-expanded="${Boolean(open)}"><span class="sr">${open ? 'Close the day' : 'Open the plan day by day'}</span>` : '<div class="strip10">';
  for (let d = 1; d <= 10; d++) {
    const mine = sessions.filter(x => x.day === d);
    if (sort) mine.sort((a, b) => sort(a.it.id, b.it.id));
    const cls = ['col', d === today ? 'today' : '', today && d < today ? 'past' : '', open === d ? 'open' : ''].filter(Boolean).join(' ');
    const icons = d === 10 ? '<span class="rvdot" aria-hidden="true"></span>'
      : mine.map((x, k) => sIcon(x.it, { small: true, cls: ` ${x.state}${x.changed ? ' changed' : ''}`, attrs: `data-day="${d}"${x.from ? ` data-from="${x.from}"` : ''} style="--dl:${(d - 1) * 45 + k * 30}ms"` })).join('');
    const label = d === 10 ? 'Day 10, review' : `Day ${d}${d === today ? ', today' : ''}${mine.length ? `: ${mine.map(x => `${x.it.name}${x.state === 'planned' ? '' : ` ${STATE_WORD[x.state]}`}`).join(', ')}` : ', free'}`;
    const inner = `<span class="dn" aria-hidden="true">${d}</span>${icons}`;
    h += tap ? `<span class="${cls}" data-day="${d}" aria-hidden="true">${inner}</span>` : `<div class="${cls}" role="img" aria-label="${esc(label)}">${inner}</div>`;
  }
  return h + (tap ? '</button>' : '</div>');
}
const occSessions = span => span.occurrences.map(o => ({ it: span.intentions.find(x => x.id === o.intention_id), day: o.day, state: stateOf(span, o) })).filter(x => x.it);

// Full: the Days tab, one row per day with big icons. Tap an icon to check it off, a day to open it.
function daysView(span, { live = false, today = 0 } = {}) {
  const sort = byGoal(span);
  const flash = ui.flash && ui.flash.until > Date.now() && ui.flash.span === span.id ? ui.flash.days : [];
  let h = '<ol class="days" aria-label="Days">';
  for (let d = 1; d <= 10; d++) {
    const occ = span.occurrences.filter(o => o.day === d).sort((a, b) => sort(a.intention_id, b.intention_id));
    const date = fmt(dayDate(span, d));
    const done = occ.filter(o => o.done).length;
    const unsure = occ.filter(o => unconfirmed(span, o)).length;
    const cls = ['day', d === today ? 'today' : '', live && d < today ? 'past' : '', d === 10 ? 'review' : '', flash.includes(d) ? 'flash' : ''].filter(Boolean).join(' ');
    const label = d === 10 ? `Day 10, ${date}, review` : `Day ${d}, ${date}${d === today ? ', today' : ''}, ${occ.length ? (live ? `${done} of ${occ.length} done${unsure ? `, ${unsure} not confirmed` : ''}` : `${occ.length} planned`) : 'free'}`;
    const rest = d === 10 ? ', review' : `${d === today ? `, ${date}` : ''}, ${occ.length ? (live ? `${done} of ${occ.length} done${unsure ? `, ${unsure} not confirmed` : ''}` : `${occ.length} planned`) : 'free'}`;
    const dl = `<span class="sr">Day </span><span class="dn">${d}</span><span class="sr">, </span><span class="dd">${d === today ? 'Today' : date}</span><span class="sr">${esc(rest)}</span>`;
    const head = live && d < 10 ? `<button class="dl" data-a="open-day" data-day="${d}">${dl}</button>` : `<div class="dl" role="img" aria-label="${esc(label)}">${dl}</div>`;
    let ss;
    if (d === 10) ss = '<span class="rvdot" aria-hidden="true"></span><span class="free">Review</span>';
    else if (!occ.length) ss = '<span class="free">Free</span>';
    else ss = occ.map(o => {
      const it = span.intentions.find(x => x.id === o.intention_id) || { id: o.intention_id, name: o.intention_id };
      const st = stateOf(span, o);
      const key = `${o.intention_id}@${d}`;
      return live
        ? sIcon(it, { tag: 'button', cls: ` ${st}`, attrs: `data-a="toggle" data-iid="${esc(o.intention_id)}" data-day="${d}" data-flip="${esc(key)}" role="checkbox" aria-checked="${Boolean(o.done)}" aria-label="${esc(`${it.name}, ${STATE_WORD[st]}`)}"` })
        : sIcon(it, { cls: ` ${st}`, attrs: `data-flip="${esc(key)}" role="img" aria-label="${esc(it.name)}"` });
    }).join('');
    h += `<li class="${cls}" data-day="${d}">${head}<div class="ss">${ss}</div></li>`;
  }
  return h + '</ol>';
}

// Goals as rows: icon, name, and done out of target.
function goalRows(span, { live = false, editable = false, target = 'current' } = {}) {
  let h = '<ul class="goals rows">';
  for (const it of span.intentions) {
    const occ = occOf(span, it.id);
    const done = occ.filter(o => o.done).length;
    const placed = occ.filter(o => !o.missed).length;
    const count = live ? `${done} of ${it.target}` : `${it.target} ${it.target === 1 ? 'time' : 'times'}`;
    const short = placed < it.target ? `, ${placed ? `${placed} placed` : 'not placed yet'}` : '';
    const inner = `${sIcon(it)}<span class="gn"><b>${nb(it.name)}</b><span class="sr">, </span><span>${count}${live ? '<span class="sr"> done</span>' : ''}${short}</span></span>${live ? ring(done, it.target) : ''}`;
    const label = `${it.name}, ${live ? `${done} of ${it.target} done` : `${it.target} times`}${short}`;
    h += editable
      ? `<li><button class="goal row-btn" data-a="edit-int" data-t="${target}" data-iid="${esc(it.id)}">${inner}<span class="sr">. Edit</span></button></li>`
      : `<li><div class="goal" role="img" aria-label="${esc(label)}">${inner}</div></li>`;
  }
  return h + '</ul>';
}

// A snapshot of where the deka stands, shown under a reply.
function statusCard(span) {
  return { type: 'status', span: span.id, day: Math.min(10, Math.max(1, dayNum(span))),
    goals: span.intentions.map(g => ({ id: g.id, name: g.name, type: g.type, icon: iconOf(g), category: catOf(g), done: doneOf(span, g.id), target: g.target })) };
}

function itemsView(span, day) {
  const occ = span.occurrences.filter(o => o.day === day);
  if (!occ.length) return `<p class="quiet">${day === 10 ? 'Review day.' : 'Nothing planned. A free&nbsp;day.'}</p>`;
  const sort = byGoal(span);
  occ.sort((a, b) => sort(a.intention_id, b.intention_id));
  return '<ul class="items">' + occ.map(o => {
    const it = span.intentions.find(x => x.id === o.intention_id) || { name: o.intention_id };
    const unsure = unconfirmed(span, o);
    const sub = [o.missed ? 'Missed' : '', unsure ? 'Not confirmed' : '', o.detail, it.tag].filter(Boolean).join(', ');
    const key = `${o.intention_id}@${day}`;
    return `<li><button class="item${o.done ? ' done' : ''}${o.missed ? ' missed' : ''}${unsure ? ' unconfirmed' : ''}${ui.pop === key ? ' pop' : ''}" data-a="toggle" data-iid="${esc(o.intention_id)}" data-day="${day}" role="checkbox" aria-checked="${Boolean(o.done)}">
      ${sIcon(it, { cls: ` ${stateOf(span, o)}${ui.pop === key ? ' pop' : ''}` })}
      <span class="txt"><span class="nm">${esc(it.name)}</span>${sub ? `<span class="dt">${esc(sub)}</span>` : ''}</span></button></li>`;
  }).join('') + '</ul>';
}

function notesField(span, day, label, placeholder) {
  return `<div class="section"><label class="label" for="note-${day}">${label}</label>
    <textarea class="field" id="note-${day}" data-note="${day}" placeholder="${esc(nbRaw(placeholder))}">${esc(span.notes[day] || '')}</textarea>

}

/* Chat */

function chatSpan() { if (!S.current) S.current = newSpan(todayIso()); return S.current; }

function chatEmpty(span) {
  const p = phase();
  if (p === 'planning') {
    return `<div class="chat-empty fade">${mark('medium')}<h1 class="display small">What do the next 10&nbsp;days&nbsp;hold?</h1>
      <p class="lede">Tell Deka your goals. As many as you&nbsp;like.</p></div>`;
  }
  return `<div class="chat-empty fade">${mark('medium')}<h1 class="display small">Day ${Math.min(dayNum(span), 10)}</h1>
    <p class="lede">Ask Deka to move, add or drop&nbsp;anything.</p></div>`;
}

const paragraphs = t => esc(t);

function cardView(msg, card, i, readonly) {
  if (card.type === 'goals') {
    return `<div class="card"><span class="eyebrow">Goals</span><ul class="lines">${card.lines.map(l => `<li>${nb(l)}</li>`).join('')}</ul></div>`;
  }
  if (card.type === 'log') {
    const span = spanById(card.span);
    const chips = card.entries.map((e, k) => {
      const o = span && findOcc(span, e.goal_id, card.day);
      const st = o ? statusOf(o) : e.status;
      const name = span ? nameOf(span, e.goal_id) : e.goal_id;
      const word = st === 'done' ? 'done' : st === 'missed' ? 'missed' : 'open';
      return readonly || !o
        ? `<span class="chip ${word}"><i></i>${esc(name)} ${word}</span>`
        : `<button class="chip ${word}" data-a="log-flip" data-m="${msg.id}" data-c="${i}" data-k="${k}" aria-label="${esc(`${name}, ${word}. Tap to change`)}"><i></i>${esc(name)} ${word}</button>`;
    }).join('');
    return `<div class="card"><span class="eyebrow">Day ${card.day}</span><div class="chips">${chips}</div></div>`;
  }
  if (card.type === 'proposal') {
    // The plan as a picture: every session on its day. Changed ones are ringed and glide into place.
    const span = spanFor(card.target) || chatSpan();
    const find = id => span.intentions.find(x => x.id === id);
    const moved = card.moved || null;
    const fixed = card.target === 'next' ? [] : span.occurrences.filter(o => o.done || o.missed).map(o => ({ it: find(o.intention_id), day: o.day, state: o.done ? 'done' : 'missed' }));
    const sessions = [...fixed, ...card.occurrences.map(o => {
      const key = `${o.goal_id}@${o.day}`;
      return { it: find(o.goal_id), day: o.day, state: 'planned', changed: Boolean(moved && key in moved), from: moved ? moved[key] : 0, detail: o.detail };
    })].filter(x => x.it);
    const today = card.target !== 'next' && isLive(span) ? dayNum(span) : 0;
    const openKey = `${msg.id}:${i}:`;
    const open = ui.cardOpen && ui.cardOpen.startsWith(openKey) ? Number(ui.cardOpen.slice(openKey.length)) : null;
    const tap = readonly ? null : `data-a="card-day" data-m="${msg.id}" data-c="${i}"`;
    let panel = '';
    if (open) {
      const mine = sessions.filter(x => x.day === open).sort((a, b) => byGoal(span)(a.it.id, b.it.id));
      const step = (v, lbl, dis) => `<button class="icon-btn" data-a="card-step" data-m="${msg.id}" data-c="${i}" data-v="${v}" aria-label="${lbl}"${dis ? ' disabled' : ''}>${v < 0 ? I.back : I.chev}</button>`;
      panel = `<div class="dayopen" aria-live="polite"><div class="top"><p class="h">Day ${open}, ${fmt(dayDate(span, open))}</p><span>${step(-1, 'Previous day', open <= 1)}${step(1, 'Next day', open >= 9)}</span></div>${mine.length
        ? `<ul>${mine.map(x => `<li>${sIcon(x.it, { cls: ` ${x.state}` })}<span>${esc(x.it.name)}${x.detail ? `, ${esc(x.detail)}` : ''}</span></li>`).join('')}</ul>`
        : '<p class="none">Free</p>'}</div>`;
    }
    const line = card.summary || (card.changes || [])[0] || '';
    const state = card.status === 'confirmed' ? `<div class="state">${I.tick}Confirmed</div>`
      : card.status === 'replaced' ? '<div class="state">Replaced by a newer plan</div>'
      : card.status === 'stale' ? '<div class="state">Out of date. Ask Deka&nbsp;again.</div>'
      : readonly ? '' : `<div class="row"><button class="btn primary" data-a="confirm" data-m="${msg.id}" data-c="${i}">Confirm</button><button class="btn" data-a="tweak">Tweak</button></div>`;
    return `<div class="card proposal${card.status === 'replaced' || card.status === 'stale' ? ' quiet' : ''}" data-card="${esc(card.id || '')}"${moved ? ' data-base="1"' : ''}><span class="eyebrow">${card.target === 'next' ? 'Next deka' : 'Proposed plan'}</span>
      ${stripCompact(sessions, { today, open, tap, sort: byGoal(span) })}${panel}
      ${line ? `<p class="summary">${nb(line)}</p>` : ''}${state}</div>`;
  }
  if (card.type === 'status') {
    const label = `Where we are: day ${card.day}. ${card.goals.map(g => `${g.name} ${g.done} of ${g.target}`).join(', ')}.`;
    const goals = card.goals.map(g => `<li>${ring(g.done, g.target)}${sIcon(g, { cls: g.done >= g.target ? ' full' : '' })}</li>`).join('');
    return `<div class="card status" role="img" aria-label="${esc(label)}"><div class="top"><span class="dayn">Day ${card.day}</span>${mini(card.day)}</div><ul class="gl">${goals}</ul></div>`;
  }
  return '';
}

function msgView(msg, { readonly = false } = {}) {
  if (msg.role === 'user') {
    return `<div class="msg user" id="m-${msg.id}"><div class="bubble">${esc(msg.text)}</div>${msg.status === 'waiting' ? '<div class="msg-state">Waiting for connection</div>' : ''}</div>`;
  }
  const live = ui.turn && ui.turn.msg === msg;
  const text = live ? ui.turn.shown : msg.text;
  const cards = (msg.cards || []).map((c, i) => cardView(msg, c, i, readonly)).join('');
  const err = msg.error && !readonly ? `<div class="msg-error" role="alert"><span>${esc(msg.error)}</span><button class="link" data-a="retry" data-m="${msg.id}">Try again</button></div>` : '';
  return `<div class="msg deka" id="m-${msg.id}"${live ? ' aria-busy="true"' : ''}><p class="say"><span class="t">${paragraphs(text)}</span>${live ? `${mark('inline', true)}<span class="waking" hidden>Waking up</span><span class="sr">Deka is thinking</span>` : ''}</p><div class="cards">${cards}</div>${err}</div>`;
}

function chatView() {
  const span = chatSpan();
  const msgs = span.chat;
  if (!msgs.length && !ui.turn) return `<div class="chat" id="chat" role="log" data-span="${span.id}">${chatEmpty(span)}</div>`;
  return `<h1 class="sr">Chat with Deka</h1><div class="chat" id="chat" role="log" data-span="${span.id}">${msgs.map(m => msgView(m)).join('')}</div>`;
}

// Keeps the chat in place while things change, so a streaming reply is never redrawn.
function refreshChat() {
  const box = $('chat');
  const span = chatSpan();
  if (!box || box.dataset.span !== span.id || ui.tab !== 'chat' || ui.sub) return false;
  if (!span.chat.length) return false;
  if (box.querySelector('.chat-empty')) { box.innerHTML = ''; box.insertAdjacentHTML('beforebegin', '<h1 class="sr">Chat with Deka</h1>'); }
  const seen = new Set([...box.children].map(c => c.id));
  for (const m of span.chat) {
    const el = $(`m-${m.id}`);
    if (!el) { box.insertAdjacentHTML('beforeend', msgView(m)); continue; }
    seen.delete(el.id);
    if (ui.turn && ui.turn.msg === m) {
      el.querySelector('.cards').innerHTML = (m.cards || []).map((c, i) => cardView(m, c, i)).join('');
      continue;
    }
    const html = msgView(m);
    if (el.outerHTML !== html) el.outerHTML = html;
  }
  for (const id of seen) $(id)?.remove();
  play();
  return true;
}

function nearBottom() { return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 140; }
function toBottom(smooth) { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); }

/* Days */

function daysTab() {
  const cur = S.current;
  if (!cur || !cur.occurrences.length) {
    return empty('No days&nbsp;planned', 'Tell Deka your goals and ask for a&nbsp;plan.', 'Open chat', 'go-chat');
  }
  if (!isLive(cur)) {
    return `<div class="head fade"><div class="eyebrow">Draft, ${range(cur.start)}</div><h1 class="display small">Not started&nbsp;yet</h1>
      <p class="sub">Confirm a plan in the chat to&nbsp;begin.</p></div>` + daysView(cur);
  }
  const n = dayNum(cur);
  if (n < 1) return `<div class="head fade"><div class="eyebrow">Starts ${fmt(cur.start)}</div><h1 class="display small">Your next deka is&nbsp;set.</h1></div>` + daysView(cur, { live: true });
  let h = `<div class="head fade"><div class="eyebrow">${n >= 10 ? 'Review' : fmt(todayIso())}</div><h1 class="display">Day ${Math.min(n, 10)}</h1><div class="sub">${mini(n)}</div></div>`;
  if (n >= 10) h += `<div class="actions" style="margin:-8px 0 20px"><button class="btn primary" data-a="go-chat">Open the review</button></div>`;
  return h + daysView(cur, { live: true, today: n });
}

// One day in a sheet: its sessions with names, and notes.
function daySheet(sh) {
  const span = S.current;
  return `${itemsView(span, sh.day)}${notesField(span, sh.day, 'Notes', 'Anything worth keeping.')}`;
}

/* Goals */

function goalsTab() {
  const span = spanFor(goalTarget()) || chatSpan();
  const t = span === S.next ? 'next' : 'current';
