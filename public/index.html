/* Render */

function render() {
  const flip = ui.tab === 'days' && !ui.sub && !ui.locked ? capture() : null;
  const intro = !ui.locked && !S.seen;
  document.body.classList.toggle('no-tabs', ui.locked || intro);
  renderBar();
  let kept = false;
  if (ui.locked) $main.innerHTML = loginView();
  else if (ui.status) $main.innerHTML = waitingView(ui.status);
  else if (intro) $main.innerHTML = introView();
  else if (ui.sub === 'past') $main.innerHTML = pastView();
  else if (ui.sub === 'settings') $main.innerHTML = settingsView();
  else if (ui.sub === 'thread') $main.innerHTML = threadView();
  else if (ui.tab === 'days') $main.innerHTML = daysTab();
  else if (ui.tab === 'goals') $main.innerHTML = goalsTab();
  else { kept = refreshChat(); if (!kept) $main.innerHTML = chatView(); }
  ui.pop = null;
  $tabs.hidden = false;
  const active = ui.sub === 'day' ? 'days' : ui.sub ? '' : ui.tab;
  for (const b of $tabs.querySelectorAll('button')) {
    if (b.dataset.tab === active) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  renderDock();
  renderSheet();
  if (flip) glide(flip);
  play();
  saveSoon();
}

/* Motion: transform and opacity only, and none with reduced motion. */

const calm = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.16, 1, .3, 1)';
// Where every session sits before a redraw, so a moved one can glide from its old day.
function capture() {
  const at = new Map();
  for (const el of $main.querySelectorAll('[data-flip]')) at.set(el.dataset.flip.split('@')[0] + '|' + el.dataset.flip, el.getBoundingClientRect());
  return at;
}
function glide(before) {
  if (calm() || !before.size) return;
  const gone = new Map();
  for (const [k, r] of before) { const id = k.split('|')[0]; if (!$main.querySelector(`[data-flip="${CSS.escape(k.split('|')[1])}"]`)) gone.set(id, [...(gone.get(id) || []), r]); }
  for (const el of $main.querySelectorAll('[data-flip]')) {
    const id = el.dataset.flip.split('@')[0];
    let r = before.get(`${id}|${el.dataset.flip}`);
    if (!r) { const was = gone.get(id); if (!was || !was.length) continue; r = was.shift(); }
    const now = el.getBoundingClientRect();
    const dx = r.left - now.left, dy = r.top - now.top;
    if (Math.abs(dx) + Math.abs(dy) > 2) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 520, easing: EASE });
  }
}
// Plan cards that just arrived: sessions drop into their days one by one, like the dots of the
// mark, and on a changed plan the moved ones glide from their old day. Then any check off burst.
function play() {
  for (const id of [...ui.enter]) {
    const card = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
    if (!card) continue;
    ui.enter.delete(id);
    if (calm()) continue;
    const cols = card.querySelectorAll('.strip10 .col');
    const w = cols.length > 1 ? cols[1].getBoundingClientRect().left - cols[0].getBoundingClientRect().left : 0;
    const base = card.dataset.base === '1';
    for (const el of card.querySelectorAll('.strip10 .s')) {
      const from = Number(el.dataset.from || 0), to = Number(el.dataset.day);
      if (base && from) el.animate([{ transform: `translateX(${(from - to) * w}px)` }, { transform: 'none' }], { duration: 620, delay: 150, easing: EASE, fill: 'backwards' });
      else if (!base || el.classList.contains('changed')) el.classList.add('enter');
    }
  }
  if (ui.burst) {
    const key = ui.burst; ui.burst = null;
    const el = $main.querySelector(`[data-flip="${CSS.escape(key)}"]`) || document.querySelector('#sheet .item.pop .s');
    if (!el || calm()) return;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    const dots = Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2, r = 30 + (i % 2) * 8; return `<i style="--x:${(Math.cos(a) * r).toFixed(1)}px;--y:${(Math.sin(a) * r).toFixed(1)}px"></i>`; }).join('');
    el.insertAdjacentHTML('beforeend', `<span class="burst" aria-hidden="true">${dots}</span>`);
    setTimeout(() => el.querySelector('.burst')?.remove(), 700);
  }
}

// Tabs keep their own scroll position. The chat opens at its newest message.
function go(tab, { sub = null, day = null } = {}) {
  const key = ui.sub ? `${ui.tab}:${ui.sub}` : ui.tab;
  ui.scroll[key] = window.scrollY;
  ui.tab = tab; ui.sub = sub; ui.day = day; ui.sheet = null;
  render();
  const next = sub ? `${tab}:${sub}` : tab;
  if (tab === 'chat' && ui.scroll[next] == null) toBottom();
  else window.scrollTo(0, sub === 'day' ? 0 : (ui.scroll[next] || 0));
}
function openSub(sub, extra = {}) {
  if (!ui.sub) history.pushState({ sub }, '');
  const tab = sub === 'day' ? 'days' : ui.tab;
  ui.scroll[ui.tab] = window.scrollY;
  ui.tab = tab; ui.sub = sub; ui.day = extra.day ?? null; ui.thread = extra.thread ?? null; ui.sheet = null;
  render();
  window.scrollTo(0, 0);
  $main.focus({ preventScroll: true });
}
function closeSub() {
  ui.sub = null; ui.day = null; ui.thread = null;
  render();
  window.scrollTo(0, ui.scroll[ui.tab] || 0);
}
window.addEventListener('popstate', () => { if (ui.sub) closeSub(); });

/* Talking to Deka */

// One shared session check. The first reply waits on it. "Waking up" appears only
// if that check is still pending after a moment, so a fast reply never flashes it.
let waking = null;
function wake() {
  if (!waking) waking = api('/api/session').then(r => { ui.awake = true; return r; }, err => { waking = null; throw err; });
  return waking;
}
const WAKE_DELAY = 800;

function spanById(id) { return [S.current, S.next, ...S.spans].find(s => s && s.id === id); }
const occStatus = o => o.done ? 'done' : o.missed ? 'missed' : 'planned';

// What Deka sees this turn: the goals and schedule it is working on, the date and
// weekday of each day, recent messages and the summary of older ones.
function buildRequest(span, text, event) {
  const p = phase();
  if (p === 'planning' && span.start < todayIso() && !span.occurrences.some(o => o.done)) span.start = todayIso();
  let target = span;
  if (p === 'review') { if (!S.next) S.next = newSpan(nextStart()); target = S.next; }
  // Everything said so far, minus the reply being written and the message being sent now.
  const history = span.chat.filter(m => !(ui.turn && m === ui.turn.msg) && m.text);
  if (text) { const i = history.map(m => m.role === 'user' && m.text === text).lastIndexOf(true); if (i >= 0) history.splice(i, 1); }
  const lines = m => {
    let t = m.text;
    for (const c of m.cards || []) {
      if (c.type === 'goals') t += `\n[Goals updated: ${c.lines.join('; ')}]`;
      if (c.type === 'log') t += `\n[Logged day ${c.day}]`;
      if (c.type === 'proposal') t += `\n[Proposed a plan: ${c.summary || (c.changes || []).join('; ')}. ${c.status === 'open' ? 'Waiting for them to confirm' : c.status}]`;
      if (c.type === 'status') t += '\n[Showed where we are]';
    }
    return { role: m.role === 'user' ? 'user' : 'assistant', text: t };
  };
  const all = history.map(lines);
  const older = all.slice(span.summarizedUpTo, Math.max(span.summarizedUpTo, all.length - 30));
  const body = {
    phase: p,
    today: `${WEEKDAYS[new Date().getDay()]} ${todayIso()}`,
    current_day: p === 'live' ? dayNum(span) : null,
    days: dayMap(target.start),
    goals: target.intentions.map(g => ({ id: g.id, name: g.name, type: g.type, tag: g.tag || '', target: g.target, ...Object.fromEntries(IDENTITY.filter(k => g[k]).map(k => [k, g[k]])) })),
    schedule: target.occurrences.map(o => ({ goal_id: o.intention_id, day: o.day, status: occStatus(o), detail: o.detail || '' })),
    notes: target === span ? span.notes : {},
    summary: span.summary || '',
    past: S.spans.slice(0, 3).map(summary),
    messages: all.slice(-30),
    message: text || null,
    event: event || null,
  };
  if (older.length) body.to_summarize = older;
  // The card still waiting for Confirm, with every session on it, so a tweak adjusts that card.
  const which = target === S.next ? 'next' : 'current';
  const open = span.chat.flatMap(m => m.cards || []).filter(c => c.type === 'proposal' && c.status === 'open' && (c.target || 'current') === which).pop();
  if (open) body.open_card = { changes: open.changes, sessions: open.occurrences.map(o => ({ goal_id: o.goal_id, day: o.day, detail: o.detail || '' })) };
  if (p === 'review') {
    body.ended = {
      range: range(span.start),
      goals: span.intentions.map(g => ({ id: g.id, name: g.name, type: g.type, tag: g.tag || '', target: g.target, done: doneOf(span, g.id) })),
      schedule: span.occurrences.map(o => ({ goal_id: o.intention_id, day: o.day, status: occStatus(o) })),
      notes: span.notes,
      reflection: span.reflection || '',
    };
  }
  return { body, target: target === S.next ? 'next' : 'current', summarizeTo: all.length - 30 };
}

// A check in still waiting for the person: the evening question, or Deka's follow up question about it.
const checkinEvent = ask => ask && ask.checkin && !ask.checkin.answered
  ? { kind: 'checkin', days: ask.checkin.days, ...(ask.checkin.followup ? { followup: true } : {}) } : null;

// Sends a message, or queues it while offline.
function sendMessage(text) {
  const span = chatSpan();
  const offline = navigator.onLine === false;
  const msg = { id: uid(), role: 'user', text, ts: Date.now(), status: offline ? 'waiting' : 'sent' };
  const ask = [...span.chat].reverse().find(m => m.role === 'deka');
  const event = checkinEvent(ask);
  span.chat.push(msg);
  render(); toBottom(true);
  if (offline || ui.turn) return;
  startTurn(span, text, event, ask);
}

function flushQueue() {
  if (ui.turn || navigator.onLine === false || ui.locked) return;
  const span = S.current;
  if (!span) return;
  const waiting = span.chat.filter(m => m.status === 'waiting');
  if (!waiting.length) return;
  waiting.forEach(m => { m.status = 'sent'; });
  const last = waiting[waiting.length - 1];
  const ask = [...span.chat].reverse().find(m => m.role === 'deka');
  const event = checkinEvent(ask);
  startTurn(span, last.text, event, ask);
}

// Reveals streamed text a word at a time, at a calm, steady pace.
function revealTick() {
  const t = ui.turn;
  if (!t) return;
  if (t.pending) {
    const m = t.pending.match(/^\s*\S+\s*/);
    const word = m ? m[0] : t.pending;
    t.pending = t.pending.slice(word.length);
    t.shown += word;
    const el = document.querySelector(`#m-${t.msg.id} .t`);
    if (el) {
      el.textContent = t.shown;
      if (ui.pinned) toBottom();
    }
  }
  if (!t.pending && t.finished) finishTurn();
}

async function startTurn(span, text, event, ask) {
  const msg = { id: uid(), role: 'deka', text: '', ts: Date.now(), cards: [] };
  span.chat.push(msg);
  const turn = ui.turn = { msg, span, shown: '', pending: '', finished: false, event, ask, text };
  ui.pinned = true;
  render(); toBottom(true);
  $('chat')?.setAttribute('aria-busy', 'true');
  turn.timer = setInterval(revealTick, 32);
  const wakeTimer = setTimeout(() => { const w = document.querySelector(`#m-${msg.id} .waking`); if (w && !ui.awake) w.hidden = false; }, WAKE_DELAY);
  try {
    if (!ui.awake) await wake();
    clearTimeout(wakeTimer);
    const hide = document.querySelector(`#m-${msg.id} .waking`); if (hide) hide.hidden = true;
    const req = buildRequest(span, text, event);
    turn.target = req.target; turn.summarizeTo = req.summarizeTo;
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req.body), credentials: 'same-origin' });
    if (res.status === 401) { ui.locked = true; throw Object.assign(new Error('locked'), { status: 401 }); }
    if (!res.ok || !res.body) throw Object.assign(new Error('failed'), { status: res.status });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1];
        const data = (block.match(/^data: (.*)$/m) || [])[1];
        if (ev && data) onEvent(turn, ev, JSON.parse(data));
      }
    }
  } catch (err) {
    clearTimeout(wakeTimer);
    if (err.status === 401) { msg.error = null; span.chat = span.chat.filter(m => m !== msg); ui.turn = null; clearInterval(turn.timer); render(); return; }
    msg.error = err.status === 503 ? 'Deka is not set up yet.' : err.status === 429 ? 'Too many messages. Wait a few minutes.' : navigator.onLine === false ? 'You are offline.' : 'Deka did not answer.';
    msg.retry = { text, event };
  }
  turn.finished = true;
  if (!turn.pending) finishTurn();
}

function onEvent(turn, ev, data) {
  const { msg } = turn;
  if (ev === 'text') { msg.text += data.delta; turn.pending += data.delta; saveSoon(); return; }
  if (ev === 'error') { msg.error = data.message; msg.retry = { text: turn.text, event: turn.event }; return; }
  if (ev === 'done') return;
  if (ev === 'summary') { turn.span.summary = data.summary; turn.span.summarizedUpTo = Math.max(0, turn.summarizeTo); return; }
  const target = spanFor(turn.target) || turn.span;
  if (ev === 'goals') {
    const before = clone({ i: target.intentions, o: target.occurrences });
    const lines = applyGoals(target, data.changes);
    msg.cards.push({ type: 'goals', lines });
    toast('Goals updated.', () => { target.intentions = before.i; target.occurrences = before.o; render(); });
  } else if (ev === 'log') {
    applyLog(turn.span, data);
    msg.cards.push({ type: 'log', span: turn.span.id, day: data.day, entries: data.entries.map(e => ({ goal_id: e.goal_id, status: e.status })) });
  } else if (ev === 'proposal') {
    // What the plan was before: the open card when tweaking one, otherwise the plan in place.
    let before = null;
    for (const m of turn.span.chat) for (const c of m.cards || []) if (c.type === 'proposal' && c.status === 'open') { before = c.occurrences; c.status = 'replaced'; }
    if (!before) before = target.occurrences.filter(o => !o.done && !o.missed).map(o => ({ goal_id: o.intention_id, day: o.day }));
    const card = { type: 'proposal', id: uid(), target: turn.target, occurrences: data.occurrences, summary: data.summary || '', changes: data.changes || [], changed_days: data.changed_days, status: 'open', moved: before.length ? movedFrom(before, data.occurrences) : null };
    msg.cards.push(card);
    ui.enter.add(card.id);
  } else if (ev === 'status') {
    if (!msg.cards.some(c => c.type === 'status')) msg.cards.push(statusCard(turn.span));
  }
  if (!refreshChat()) render(); else renderDock();
  if (ui.pinned) toBottom(true);
  saveSoon();
}

function finishTurn() {
  const t = ui.turn;
  if (!t) return;
  clearInterval(t.timer);
  ui.turn = null;
  $('chat')?.removeAttribute('aria-busy');
  const { msg, span, event, ask } = t;
  msg.text = msg.text.trim();
  if (!msg.error && event && event.kind === 'checkin' && ask) {
    ask.checkin.answered = true;
    // While sessions on those days are still open, Deka has asked about them, so the check in
    // stays open for one more answer. That answer closes it either way.
    const open = !event.followup && event.days.some(d => span.occurrences.some(o => o.day === d && !o.done && !o.missed));
    if (open) msg.checkin = { days: event.days, answered: false, followup: true };
    else {
      span.checked = [...new Set([...span.checked, ...event.days])];
      if (!msg.cards.some(c => c.type === 'status')) msg.cards.push(statusCard(span));
    }
  }
  if (!msg.error && event && event.kind === 'review') span.review = msg.text;
  const el = $(`m-${msg.id}`);
  const mk = el && el.querySelector('.mk');
  if (el) {
    el.removeAttribute('aria-busy');
    el.querySelector('.t').textContent = msg.text;
    el.querySelector('.sr')?.remove();
    el.querySelector('.waking')?.remove();
  }
  if (!msg.text && !msg.cards.length && !msg.error) span.chat = span.chat.filter(m => m !== msg);
  settleMark(mk);
  if (ui.pinned) toBottom(true);
  setTimeout(() => { const keep = ui.pinned || nearBottom(); render(); renderDock(); if (keep) toBottom(); ui.pinned = false; }, mk ? 1100 : 0);
  save();
  renderDock();
  setTimeout(flushQueue, 50);
}

/* Applying what Deka did */

// How a goal looks and plans, as Deka sets it.
const IDENTITY = ['icon', 'category', 'energy', 'social', 'fun', 'time_of_day', 'weekend'];
const identity = g => Object.fromEntries(IDENTITY.filter(k => g[k] != null).map(k => [k, g[k]]));

// For each session on a new plan that was not on the plan before it: the day it moved from, or 0 when added.
function movedFrom(before, next) {
  const had = new Set(before.map(o => `${o.goal_id}@${o.day}`));
  const now = new Set(next.map(o => `${o.goal_id}@${o.day}`));
  const left = before.filter(o => !now.has(`${o.goal_id}@${o.day}`));
  const out = {};
  for (const o of next) {
    const key = `${o.goal_id}@${o.day}`;
    if (had.has(key)) continue;
    const i = left.findIndex(x => x.goal_id === o.goal_id);
    out[key] = i >= 0 ? left.splice(i, 1)[0].day : 0;
  }
  return out;
}

function applyGoals(span, changes) {
  const lines = [];
  for (const c of changes) {
    if (c.op === 'add') {
      if (!span.intentions.some(g => g.id === c.id)) span.intentions.push({ id: c.id, name: c.name, type: c.type, tag: c.tag || '', target: c.target, ...identity(c) });
      lines.push(`Added ${c.name}, ${c.target} ${c.target === 1 ? 'time' : 'times'}`);
    } else if (c.op === 'edit') {
      const g = span.intentions.find(x => x.id === c.id);
      if (!g) continue;
      const was = g.target;
      Object.assign(g, { name: c.name, type: c.type, tag: c.tag || '', target: c.target, ...identity(c) });
      lines.push(was !== c.target ? `${c.name} now ${c.target} ${c.target === 1 ? 'time' : 'times'}` : `Updated ${c.name}`);
    } else if (c.op === 'remove') {
      span.intentions = span.intentions.filter(g => g.id !== c.id);
      span.occurrences = span.occurrences.filter(o => o.intention_id !== c.id);
      lines.push(`Removed ${c.name}`);
    }
  }
  return lines;
}

function applyLog(span, data) {
  for (const e of data.entries) {
    let o = findOcc(span, e.goal_id, data.day);
    if (!o && e.moved_from) { o = findOcc(span, e.goal_id, e.moved_from); if (o) o.day = data.day; }
    if (!o && e.extra) {
      o = { intention_id: e.goal_id, day: data.day, done: false, detail: '' };
      span.occurrences.push(o);
      const g = span.intentions.find(x => x.id === e.goal_id);
      if (g && doneOf(span, g.id) + 1 > g.target) g.target = Math.min(9, g.target + 1);
    }
    if (!o) continue;
    o.done = e.status === 'done'; o.missed = e.status === 'missed';
  }
}

// A proposal still fits if every goal needs exactly the listed sessions and nothing lands on finished work or a passed day.
function proposalFits(span, card) {
  const from = openFrom(span);
  for (const g of span.intentions) {
    const need = Math.max(0, g.target - doneOf(span, g.id));
    if (card.occurrences.filter(o => o.goal_id === g.id).length !== need) return false;
  }
  return card.occurrences.every(o => span.intentions.some(g => g.id === o.goal_id) && o.day >= from && o.day <= 9 &&
    !span.occurrences.some(x => x.intention_id === o.goal_id && x.day === o.day && (x.done || x.missed)));
}

function confirmProposal(msg, card) {
  const span = spanFor(card.target);
  if (!span || !proposalFits(span, card)) { card.status = 'stale'; render(); toast('This plan is out of date. Ask Deka again.'); return; }
  const before = clone({ o: span.occurrences, status: span.status, start: span.start, card: card.status, cur: S.current && S.current.id, next: S.next && S.next.id });
  const keep = span.occurrences.filter(o => o.done || o.missed);
  span.occurrences = [...keep, ...card.occurrences.map(o => ({ intention_id: o.goal_id, day: o.day, done: false, detail: o.detail || '' }))];
  card.status = 'confirmed';
  ui.flash = { span: span.id, days: card.changed_days, until: Date.now() + 8000 };
  if (card.target === 'next') {
    closeCurrent();
    S.current = span; S.next = null;
    Object.assign(span, { status: 'live' });
    render(); toast('Next deka started.');
    return;
  }
  // Where we are, right under the confirmed plan. Undo takes it away again.
  const status = () => { const st = statusCard(span); msg.cards.push(st); return () => { msg.cards = msg.cards.filter(c => c !== st); }; };
  if (span.status !== 'live') {
    if (span.start < todayIso()) span.start = todayIso();
    span.status = 'live';
    const drop = status();
    render(); toast('Deka started.', () => { Object.assign(span, { occurrences: before.o, status: before.status, start: before.start }); card.status = 'open'; drop(); render(); });
    return;
  }
  const drop = status();
  render();
  toast('Schedule updated.', () => { span.occurrences = before.o; card.status = 'open'; drop(); render(); });
}

function closeCurrent() {
  const cur = S.current;
  cur.status = 'done';
  cur.closed = todayIso();
  S.spans.unshift(cur);
}

/* Check ins and the review */

function checkinDue() {
  const [h, m] = S.settings.checkin.split(':').map(Number);
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() >= h * 60 + m;
}
function dayList(days, today) {
  const names = days.map(d => d === today ? 'today' : d === today - 1 ? 'yesterday' : `Day ${d}`);
  return names.length > 1 ? `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}` : names[0];
}
// "yesterday's sober night and make music", grouped by day.
function unsureList(span, occ, today) {
  const list = a => a.length > 1 ? `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}` : a[0];
  const days = [...new Set(occ.map(o => o.day))].sort((a, b) => a - b);
  return list(days.map(d => `${d === today - 1 ? 'yesterday' : `day ${d}`}'s ${list(occ.filter(o => o.day === d).map(o => nameOf(span, o.intention_id).toLowerCase()))}`));
}
// Once a day, after the check in time, Deka asks how it went. Skipped days are asked about too.
function maybeCheckin() {
  const cur = S.current;
  if (!isLive(cur) || ui.locked || !S.seen) return;
  const n = dayNum(cur);
  if (n < 1 || n > 9 || !checkinDue() || cur.checkin.asked === todayIso()) return;
  const days = [];
  for (let d = 1; d <= n; d++) {
    if (cur.checked.includes(d)) continue;
    const planned = cur.occurrences.some(o => o.day === d);
    const open = cur.occurrences.some(o => o.day === d && !o.done && !o.missed);
    if (open || (d === n && (planned || n > 1))) days.push(d);
  }
  cur.checkin.asked = todayIso();
  // Sessions Deka asked about that never got an answer come first, in the same question.
  const waiting = cur.chat.filter(m => m.checkin && m.checkin.followup && !m.checkin.answered);
  const unsure = [];
  for (const m of waiting) {
    m.checkin.answered = true;
    for (const o of cur.occurrences) if (m.checkin.days.includes(o.day) && unconfirmed(cur, o)) unsure.push(o);
  }
  if (!days.length) return;
  const rest = days.filter(d => !unsure.some(o => o.day === d));
  const text = unsure.length ? `Did ${unsureList(cur, unsure, n)} happen${rest.length ? `, and how did ${dayList(rest, n)} go` : ''}?` : `How did ${dayList(days, n)} go?`;
  cur.chat.push({ id: uid(), role: 'deka', text, ts: Date.now(), cards: [], checkin: { days, answered: false } });
  save();
}
// On Day 10 the review opens in the chat by itself.
function maybeReview() {
  const cur = S.current;
  if (!isLive(cur) || dayNum(cur) < 10 || cur.reviewOpened || ui.turn || ui.locked || navigator.onLine === false) return;
  cur.reviewOpened = todayIso();
  if (!S.next) S.next = newSpan(nextStart());
  startTurn(cur, null, { kind: 'review' }, null);
}

/* Goal editing by hand */

function openEdit(target, iid) { ui.sheet = { kind: 'edit', target, iid, sel: null, confirmDelete: false }; renderSheet(); focusSheet(); }
function openNew(target) {
  const span = spanFor(target) || chatSpan();
  const from = openFrom(span);
  ui.sheet = { kind: 'new', target, sel: null, draft: { name: '', type: 'do', days: spread(3, from) } };
  renderSheet(); focusSheet(true);
}
function focusSheet(name) {
  requestAnimationFrame(() => {
    const el = name ? $('intName') : $('sheetTitle');
    if (el) { if (!name) el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }); }
  });
}
function closeSheet() {
  const sh = ui.sheet;
  ui.sheet = null;
  if (sh && sh.kind === 'edit') {
    const span = spanFor(sh.target);
    const it = span && span.intentions.find(x => x.id === sh.iid);
    if (it && !it.name.trim()) it.name = 'Untitled';
    if (sh.before) toast('Goal updated.', () => { span.intentions = sh.before.i; span.occurrences = sh.before.o; render(); });
  }
  render();
}
// Remembers the goal as it was when editing started, for the Undo toast.
function markEdited(sh) {
  if (sh.kind !== 'edit' || sh.before) return;
  const span = spanFor(sh.target);
  sh.before = clone({ i: span.intentions, o: span.occurrences });
}

function sheetCount(delta) {
  const sh = ui.sheet;
  const span = spanFor(sh.target);
  const from = openFrom(span);
  if (sh.kind === 'new') {
    const days = sh.draft.days;
    if (delta > 0 && days.length < 9) { const d = bestFreeDay(span, days, from) || bestFreeDay(span, days, 1); if (d) days.push(d); }
    if (delta < 0 && days.length > 1) days.sort((a, b) => a - b).pop();
    sh.sel = null; render(); return;
  }
  markEdited(sh);
  const g = span.intentions.find(x => x.id === sh.iid);
  const full = plannedOf(span, g.id) >= g.target - doneOf(span, g.id);
  if (delta > 0 && g.target < 9) {
    g.target++;
    if (full && span.occurrences.length) {
      const d = bestFreeDay(span, occOf(span, g.id).map(o => o.day), from);
      if (d) span.occurrences.push({ intention_id: g.id, day: d, done: false, detail: '' });
    }
  } else if (delta < 0 && g.target > Math.max(1, doneOf(span, g.id))) {
    g.target--;
    const need = g.target - doneOf(span, g.id);
    while (plannedOf(span, g.id) > need) {
      const last = occOf(span, g.id).filter(o => !o.done && !o.missed).sort((a, b) => b.day - a.day)[0];
      span.occurrences = span.occurrences.filter(o => o !== last);
    }
  }
  sh.sel = null;
  render();
}

function sheetPick(day) {
  const sh = ui.sheet;
  const span = spanFor(sh.target);
  const days = sheetDays(sh);
  const on = days.includes(day);
  if (sh.kind === 'new') {
    if (sh.sel === day) sh.sel = null;
    else if (sh.sel && !on) { sh.draft.days = days.map(d => d === sh.sel ? day : d); sh.sel = null; }
    else if (on) sh.sel = day;
    else if (days.length < 9) sh.draft.days.push(day);
    render(); return;
  }
  markEdited(sh);
  const g = span.intentions.find(x => x.id === sh.iid);
  if (sh.sel === day) sh.sel = null;
  else if (sh.sel && !on) { const o = findOcc(span, sh.iid, sh.sel); if (o) o.day = day; sh.sel = null; }
  else if (on) sh.sel = day;
  else {
    span.occurrences.push({ intention_id: sh.iid, day, done: false, detail: '' });
    if (occOf(span, g.id).filter(o => !o.missed).length > g.target) g.target = Math.min(9, g.target + 1);
  }
  render();
}

function sheetRemove() {
  const sh = ui.sheet;
  const span = spanFor(sh.target);
  if (!sh.sel) return;
  if (sh.kind === 'new') { if (sh.draft.days.length > 1) sh.draft.days = sh.draft.days.filter(d => d !== sh.sel); sh.sel = null; render(); return; }
  markEdited(sh);
  const g = span.intentions.find(x => x.id === sh.iid);
  const o = findOcc(span, sh.iid, sh.sel);
  const wasFull = plannedOf(span, g.id) >= g.target - doneOf(span, g.id);
  span.occurrences = span.occurrences.filter(x => x !== o);
  if (wasFull && o && !o.missed && g.target > Math.max(1, doneOf(span, g.id))) g.target--;
  sh.sel = null;
  render();
}

function deleteIntention() {
  const sh = ui.sheet;
  if (!sh.confirmDelete) { sh.confirmDelete = true; renderSheet(); setTimeout(() => { if (ui.sheet === sh && sh.confirmDelete) { sh.confirmDelete = false; renderSheet(); } }, 3000); return; }
  const span = spanFor(sh.target);
  const before = sh.before || clone({ i: span.intentions, o: span.occurrences });
  const name = nameOf(span, sh.iid);
  span.intentions = span.intentions.filter(it => it.id !== sh.iid);
  span.occurrences = span.occurrences.filter(o => o.intention_id !== sh.iid);
  ui.sheet = null;
  render();
  toast(`${name} deleted.`, () => { span.intentions = before.i; span.occurrences = before.o; render(); });
}

function addFromSheet() {
  const sh = ui.sheet;
  const name = sh.draft.name.trim();
  if (!name) return;
  const span = spanFor(sh.target) || chatSpan();
  const before = clone({ i: span.intentions, o: span.occurrences });
  let id = slug(name);
  while (span.intentions.some(it => it.id === id)) id += '_' + uid().slice(0, 2);
  const icon = GOAL_ICONS[sh.draft.icon] ? sh.draft.icon : guessIcon(name, sh.draft.type);
  const [category, energy, social, fun, time_of_day, weekend] = GOAL_ICONS[icon];
  span.intentions.push({ id, name, type: sh.draft.type, tag: '', target: sh.draft.days.length, icon, category, energy, social, fun, time_of_day, weekend });
  for (const d of sh.draft.days) span.occurrences.push({ intention_id: id, day: d, done: false, detail: '' });
  ui.sheet = null;
  render();
  toast(`${name} added.`, () => { span.intentions = before.i; span.occurrences = before.o; render(); });
}

/* Check off */

function toggle(iid, day) {
  const span = S.current;
  const o = findOcc(span, iid, day);
  if (!o) return;
  o.done = !o.done;
  if (o.done) {
    o.missed = false;
    ui.pop = ui.burst = `${iid}@${day}`;
    if (navigator.vibrate) navigator.vibrate(8);
  }
  render();
  if (o.done) toast(`${nameOf(span, iid)} done.`, () => { o.done = false; render(); });
}

/* Events */

document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    if (ui.sub && history.state && history.state.sub) history.replaceState(null, '');
    go(tab.dataset.tab);
    return;
  }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  switch (a) {
    case 'intro-start': S.seen = true; chatSpan(); go('chat'); $('msg')?.focus(); break;
    case 'mic': listen(el); break;
    case 'go-chat': go('chat'); break;
    case 'more': ui.sheet = { kind: 'more' }; renderSheet(); focusSheet(); break;
    case 'go-past': ui.sheet = null; openSub('past'); break;
    case 'go-settings': ui.sheet = null; openSub('settings'); break;
    case 'open-thread': openSub('thread', { thread: el.dataset.id }); break;
    case 'back': history.state && history.state.sub ? history.back() : closeSub(); break;
    case 'sheet-close': closeSheet(); break;
    case 'add-int': openNew(el.dataset.t || 'current'); break;
    case 'edit-int': openEdit(el.dataset.t, el.dataset.iid); break;
    case 'sheet-type': {
      const sh = ui.sheet;
      if (sh.kind === 'new') sh.draft.type = el.dataset.v;
      else { markEdited(sh); const it = spanFor(sh.target).intentions.find(x => x.id === sh.iid); if (it) it.type = el.dataset.v; }
      render(); break;
    }
    case 'sheet-count': sheetCount(Number(el.dataset.v)); break;
    case 'pick': sheetPick(Number(el.dataset.day)); break;
    case 'pick-remove': sheetRemove(); break;
    case 'delete-int': deleteIntention(); break;
    case 'toast-undo': { const f = ui.toastUndo; hideToast(); if (f) f(); break; }
    case 'toggle': toggle(el.dataset.iid, Number(el.dataset.day)); break;
    case 'open-day': ui.sheet = { kind: 'day', day: Number(el.dataset.day) }; renderSheet(); focusSheet(); break;
    case 'card-day': {
      // The day under the tap, or today (or day 1) from the keyboard. Tapping the open day closes it.
      const base = `${el.dataset.m}:${el.dataset.c}:`;
      const col = e.target.closest('[data-day]');
      const span = chatSpan();
      const day = col ? Math.min(9, Number(col.dataset.day)) : Math.min(9, Math.max(1, isLive(span) ? dayNum(span) : 1));
      ui.cardOpen = ui.cardOpen === base + day || (!col && ui.cardOpen && ui.cardOpen.startsWith(base)) ? null : base + day;
      if (!refreshChat()) render();
      break;
    }
    case 'card-step': {
      const base = `${el.dataset.m}:${el.dataset.c}:`;
      const day = Number((ui.cardOpen || '').slice(base.length)) || 1;
      ui.cardOpen = base + Math.min(9, Math.max(1, day + Number(el.dataset.v)));
      if (!refreshChat()) render();
      document.querySelector(`[data-a="card-step"][data-m="${el.dataset.m}"][data-v="${el.dataset.v}"]:not([disabled])`)?.focus();
      break;
    }
    case 'icon-open': ui.sheet.icons = !ui.sheet.icons; renderSheet(); break;
    case 'icon-pick': {
      const sh = ui.sheet, k = el.dataset.v;
      const it = sh.kind === 'new' ? sh.draft : spanFor(sh.target).intentions.find(x => x.id === sh.iid);
      if (sh.kind !== 'new') markEdited(sh);
      if (it) { it.icon = k; it.category = GOAL_ICONS[k][0]; }
      render(); break;
    }
    case 'confirm': {
      const span = chatSpan();
      const msg = span.chat.find(m => m.id === el.dataset.m);
      const card = msg && msg.cards[Number(el.dataset.c)];
      if (card && card.status === 'open') confirmProposal(msg, card);
      break;
    }
    case 'tweak': { ui.tweak = true; renderDock(); $('msg')?.focus(); break; }
    case 'log-flip': {
      const span = chatSpan();
      const msg = span.chat.find(m => m.id === el.dataset.m);
      const card = msg && msg.cards[Number(el.dataset.c)];
      const entry = card && card.entries[Number(el.dataset.k)];
      const o = entry && findOcc(span, entry.goal_id, card.day);
      if (o) { const was = o.done; o.done = !was; o.missed = was; entry.status = o.done ? 'done' : 'missed'; render(); }
      break;
    }
    case 'retry': {
      const span = chatSpan();
      const msg = span.chat.find(m => m.id === el.dataset.m);
      if (!msg || ui.turn) return;
      const again = msg.retry || {};
      span.chat = span.chat.filter(m => m !== msg);
      const ask = [...span.chat].reverse().find(m => m.role === 'deka' && m.checkin);
      render();
      startTurn(span, again.text, again.event, ask);
      break;
    }
    case 'open-past': ui.openPast = ui.openPast === el.dataset.id ? null : el.dataset.id; render(); break;
    case 'export': exportData(); break;
    case 'import': $('importFile').click(); break;
    case 'discard':
      if (!confirm('Discard this deka? Past dekas stay.')) return;
      S.current = null; S.next = null; closeSub(); go('chat'); break;
    case 'lock': api('/api/logout', {}).catch(() => {}).finally(() => { ui.locked = true; ui.loginError = ''; ui.sub = null; render(); }); break;
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'login') {
    const pass = $('pass').value;
    api('/api/login', { passcode: pass })
      .then(() => { ui.locked = false; ui.loginError = ''; ui.awake = true; render(); boot(); })
      .catch(err => { ui.loginError = err.status === 429 ? 'Too many tries. Wait a few minutes.' : err instanceof TypeError ? 'No connection. Try again.' : 'Wrong passcode.'; render(); $('pass')?.focus(); });
    return;
  }
  if (kind === 'sheet') { if (ui.sheet && ui.sheet.kind === 'new') addFromSheet(); else closeSheet(); return; }
  const ta = $('msg');
  const text = ta.value.trim();
  if (!text || ui.turn) return;
  if (rec) { rec.stop(); rec = null; }
  ta.value = '';
  ui.tweak = false;
  autosize(ta);
  sendMessage(text);
});

let noteTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'msg') {
    autosize(t);
    $dock.querySelector('.send').disabled = !t.value.trim() || Boolean(ui.turn);
    setDockHeight();
    return;
  }
  if (t.id === 'intName' && ui.sheet) {
    const sh = ui.sheet;
    if (sh.kind === 'new') { sh.draft.name = t.value; $('sheetAdd').disabled = !t.value.trim(); }
    else {
      markEdited(sh);
      const it = spanFor(sh.target).intentions.find(x => x.id === sh.iid);
      if (it) { it.name = t.value; saveSoon(); }
    }
    return;
  }
  if (t.dataset && t.dataset.note) {
    S.current.notes[t.dataset.note] = t.value;
    flashSaved(`saved-${t.dataset.note}`);
  }
});

function flashSaved(id) {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    save();
    const el = $(id);
    if (!el) return;
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 1400);
  }, 400);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'msg') {
    e.preventDefault();
    e.target.closest('form').requestSubmit();
  }
  if (e.key === 'Enter' && e.target.id === 'intName') {
    e.preventDefault();
    if (ui.sheet && ui.sheet.kind === 'new') addFromSheet(); else e.target.blur();
  }
  if (e.key === 'Escape' && ui.sheet) closeSheet();
});

document.addEventListener('change', e => {
  if (e.target.id === 'startDate' && e.target.value && S.current) { S.current.start = e.target.value; saveSoon(); }
  if (e.target.id === 'checkinTime' && e.target.value) { S.settings.checkin = e.target.value; saveSoon(); }
  if (e.target.id === 'importFile') importData(e.target.files[0]);
});

window.addEventListener('online', () => { renderDock(); refreshChat(); flushQueue(); maybeReview(); });
window.addEventListener('offline', renderDock);

/* Header hairline once the page scrolls */
const $barEl = $('bar');
let lastY = window.scrollY;
window.addEventListener('scroll', () => {
  $barEl.classList.toggle('scrolled', window.scrollY > 4);
  // Scrolling up during a reply lets the person read back without being pulled down.
  if (ui.pinned && window.scrollY < lastY - 8) ui.pinned = false;
  lastY = window.scrollY;
}, { passive: true });

/* Keyboard: keep the composer and the sheet above it */
const vv = window.visualViewport;
function onViewport() {
  if (!vv) return;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', `${Math.round(kb)}px`);
  document.body.classList.toggle('kb', kb > 80);
  setDockHeight();
}
if (vv) { vv.addEventListener('resize', onViewport); vv.addEventListener('scroll', onViewport); }

/* Sheet: a grabber and detents. Drag the grabber or the top of the sheet: up to large, down to
   medium, down again to dismiss. A quick flick counts as much as a long drag. */
let sheetDrag = null;
function sheetDetent() {
  const el = $('sheet');
  if (!el || !ui.sheet) return;
  el.classList.remove('medium', 'large');
  // Measure at full height: only a sheet taller than medium gets the medium detent.
  ui.sheet.tall = el.scrollHeight > innerHeight * 0.6;
  if (ui.sheet.tall) ui.sheet.detent = ui.sheet.detent === 'large' ? 'large' : 'medium';
  el.classList.add(ui.sheet.tall ? ui.sheet.detent : 'fit');
}
document.addEventListener('pointerdown', e => {
  if (!ui.sheet || e.button > 0) return;
  const top = e.target.closest('#sheetHandle, .sheet-top');
  if (!top || e.target.closest('button, input, textarea')) return;
  sheetDrag = { y: e.clientY, t: performance.now(), el: $('sheet') };
  sheetDrag.el.classList.add('dragging');
  try { top.setPointerCapture(e.pointerId); } catch {}
});
document.addEventListener('pointermove', e => {
  if (!sheetDrag) return;
  const dy = e.clientY - sheetDrag.y;
  // Down follows the finger; up gives a little, like a rubber band.
  sheetDrag.el.style.transform = `translateY(${dy > 0 ? dy : dy / 4}px)`;
});
document.addEventListener('pointerup', e => {
  if (!sheetDrag) return;
  const dy = e.clientY - sheetDrag.y, v = dy / Math.max(1, performance.now() - sheetDrag.t);
  const el = sheetDrag.el; sheetDrag = null;
  el.classList.remove('dragging');
  el.style.transform = '';
  const sh = ui.sheet;
  if ((dy < -40 || v < -0.5) && sh.tall) { sh.detent = 'large'; el.classList.replace('medium', 'large'); return; }
  if (dy > 70 || v > 0.6) {
    if (sh.tall && sh.detent === 'large') { sh.detent = 'medium'; el.classList.replace('large', 'medium'); return; }
    closeSheet();
  }
});
// Typing needs room: a field in a sheet takes it to large.
document.addEventListener('focusin', e => {
  if (!ui.sheet || !e.target.closest('#sheet input, #sheet textarea')) return;
  if (!ui.sheet.tall) return;
  ui.sheet.detent = 'large'; $('sheet')?.classList.replace('medium', 'large');
});

/* Desktop only: drag a session to another day on the Days tab. Touch uses the goal sheet. */
let drag = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  const s = e.target.closest('.days .s[data-a=toggle]');
  if (!s) return;
  drag = { el: s, iid: s.dataset.iid, day: Number(s.dataset.day), x: e.clientX, y: e.clientY, moved: false, over: null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
  drag.moved = true;
  drag.el.classList.add('dragging');
  drag.el.style.transform = `translate(${e.clientX - drag.x}px, ${e.clientY - drag.y}px) scale(1.12)`;
  let over = null;
  for (const row of document.querySelectorAll('.days .day')) { const r = row.getBoundingClientRect(); if (e.clientY >= r.top && e.clientY < r.bottom) over = row; }
  if (drag.over && drag.over !== over) drag.over.classList.remove('drop');
  drag.over = over;
  if (over) over.classList.add('drop');
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  const span = S.current;
  const to = d.over ? Number(d.over.dataset.day) : d.day;
  const o = findOcc(span, d.iid, d.day);
  if (o && !o.done && !o.missed && to !== d.day && to >= openFrom(span) && to <= 9 && !findOcc(span, d.iid, to)) {
    const before = clone(span.occurrences);
    o.day = to;
    render();
    toast(`${nameOf(span, d.iid)} moved to day ${to}.`, () => { span.occurrences = before; render(); });
    return;
  }
  render();
});

/* Voice */

function listen(btn) {
  if (!SR) return;
  if (rec) { rec.stop(); return; }
  const ta = $('msg');
  const base = ta.value ? ta.value.trim() + ' ' : '';
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = ev => {
    let text = '';
    for (const r of ev.results) text += r[0].transcript;
    ta.value = base + text.trim();
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onend = () => { rec = null; btn.classList.remove('listening'); };
  rec.onerror = () => { rec = null; btn.classList.remove('listening'); ta.focus(); };
  btn.classList.add('listening');
  try { rec.start(); } catch { rec = null; btn.classList.remove('listening'); ta.focus(); }
}

/* Export and import */

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `deka-${todayIso()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  if (!file) return;
  ui.status = 'Importing'; ui.sub = null; render();
  const started = Date.now();
  const r = new FileReader();
  r.onload = () => {
    // Let the mark be seen for a moment, so the import does not flash past.
    setTimeout(() => {
      ui.status = null;
      try {
        const d = JSON.parse(r.result);
        if (!isState(d)) throw new Error('shape');
        if (!confirm('Replace everything on this device with this file?')) { render(); return; }
        S = migrate(d);
        go('chat'); toast('Imported.');
      } catch { render(); toast('That file is not a Deka export.'); }
      $('importFile').value = '';
    }, Math.max(0, 700 - (Date.now() - started)));
  };
  r.readAsText(file);
}

/* Boot: draw from local data first, then check the session. */

function boot() {
  // Ask the browser to keep saved data even when space runs low or the site sits unused.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
  maybeCheckin();
  render();
  if (ui.tab === 'chat') toBottom();
  wake().then(() => { flushQueue(); maybeReview(); }).catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const before = S.current && S.current.chat.length;
  maybeCheckin();
  if (!document.activeElement?.matches('textarea, input') && !ui.sheet && !ui.turn) render();
  else if (S.current && S.current.chat.length !== before) refreshChat();
  maybeReview();
});
setInterval(() => { if (!document.hidden && !ui.turn) { const n = S.current && S.current.chat.length; maybeCheckin(); if (S.current && S.current.chat.length !== n) { refreshChat() || render(); if (nearBottom()) toBottom(true); } } }, 60000);

boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
