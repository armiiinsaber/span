<style>
@font-face {
  font-family: 'Melomaniac Serif';
  src: url('/fonts/melomaniac-serif-v0.1.woff2') format('woff2');
  font-weight: 400 900;
  font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('/fonts/inter-deka.woff2') format('woff2');
  font-weight: 400 600;
  font-display: swap;
}
:root {
  --green: #B8F06E;
  --green-ink: #24350D;
  --paper: #F5F3EC;
  --paper-deep: #ECE9DF;
  --ink: #141310;
  --ink-soft: rgba(20,19,16,.68);
  --ink-faint: rgba(20,19,16,.3);
  --hairline: rgba(20,19,16,.14);
  --serif: 'Melomaniac Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --pad-l: calc(16px + var(--safe-l));
  --pad-r: calc(16px + var(--safe-r));
  --tabs-h: 56px;
  --kb: 0px;
  --dock-h: 0px;
  --tap: 44px;
}
/* Follow the iOS text size setting. Everything below is sized in rem. */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--paper); overflow-x: clip; }
body {
  margin: 0; min-height: 100dvh; overflow-x: clip;
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--green); color: var(--ink); }
h1, h2, h3 { text-wrap: balance; font-weight: 400; margin: 0; }
p, li, .pretty { text-wrap: pretty; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; background: none; border: 0; padding: 0; }
/* Chrome of the app is not selectable; notes and Claude's words are. */
button, header, nav, .eyebrow, .label, .tile, .toast, .sheet-handle { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(var(--safe-t) + 4px) var(--pad-r) 4px var(--pad-l);
  background: rgba(245,243,236,.94);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent; transition: border-color .4s var(--ease);
}
.bar.scrolled { border-bottom-color: var(--hairline); }
.bar-in { width: 100%; max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); }
.mark { font-family: var(--serif); font-size: 1.45rem; line-height: 1; letter-spacing: -.01em; }
.icon-btn {
  min-width: var(--tap); min-height: var(--tap); display: inline-grid; place-items: center;
  border-radius: 50%; color: var(--ink);
}
.icon-btn svg { width: 22px; height: 22px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--tap); padding-right: 12px; margin-left: -8px; font-size: 1rem; }
.back svg { width: 24px; height: 24px; }

/* Main */
main {
  max-width: 560px; margin: 0 auto;
  padding: 8px var(--pad-r) calc(var(--tabs-h) + var(--safe-b) + var(--dock-h) + 40px) var(--pad-l);
}
main:focus { outline: none; }
body.no-tabs main { padding-bottom: calc(var(--safe-b) + 40px); }

.eyebrow { font-size: .6875rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
.head { text-align: center; margin: 16px 0 32px; }
.head .eyebrow { margin-bottom: 12px; }
.display {
  /* Grows with the iOS text size but never wider than the screen allows. */
  font-family: var(--serif); font-size: min(max(2.25rem, 11vw), 13vw, 3.75rem);
  line-height: .98; letter-spacing: -.02em; overflow-wrap: break-word;
}
.display.small { font-size: min(max(1.9rem, 8.5vw), 11vw, 2.75rem); line-height: 1.05; }
.display small { font-size: .5em; }
.sub { margin: 12px 0 0; font-size: .875rem; color: var(--ink-soft); }
.lede { margin: 16px auto 0; max-width: 30ch; font-size: 1.0625rem; color: var(--ink-soft); }
.label { display: block; font-size: .6875rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
.section { margin-top: 36px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: max(var(--tap), 3rem); padding: 0 22px;
  border: 1px solid var(--ink); border-radius: 2px;
  font-size: .75rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
  transition: background .3s var(--ease), transform .2s var(--ease);
}
.btn:active { background: var(--paper-deep); transform: scale(.985); }
.btn.primary { background: var(--green); }
.btn.primary:active { background: #a9e25e; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: default; }
.link {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); min-width: var(--tap); padding: 0 8px;
  font-size: .9375rem; color: var(--ink-soft);
  text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 5px;
}
.link:active { color: var(--green-ink); }
.link.danger { color: var(--ink); }
.actions { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 28px; }

.note { font-family: var(--serif); font-size: 1.25rem; line-height: 1.4; text-align: center; margin: 0 auto; max-width: 30ch; }
.question { font-size: .9375rem; text-align: center; margin: 14px auto 0; max-width: 34ch; }
.question::before { content: ''; display: block; width: 24px; height: 1px; background: var(--ink); margin: 0 auto 12px; }
.read { font-family: var(--serif); font-size: 1.3rem; line-height: 1.42; margin: 0; }
.moved { text-align: center; font-size: .9375rem; margin: 12px auto 0; max-width: 34ch; }

/* Status while Claude works */
.loading { text-align: center; padding: 32px 0 8px; }
.loading .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
.loading .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); animation: fill 3s var(--ease) infinite; }
.loading .dots i:nth-child(2) { animation-delay: .15s; } .loading .dots i:nth-child(3) { animation-delay: .3s; }
.loading .dots i:nth-child(4) { animation-delay: .45s; } .loading .dots i:nth-child(5) { animation-delay: .6s; }
.loading .dots i:nth-child(6) { animation-delay: .75s; } .loading .dots i:nth-child(7) { animation-delay: .9s; }
.loading .dots i:nth-child(8) { animation-delay: 1.05s; } .loading .dots i:nth-child(9) { animation-delay: 1.2s; }
.loading .dots i:nth-child(10) { animation-delay: 1.35s; border-style: dotted; }
@keyframes fill { 0%, 100% { background: transparent; } 30%, 60% { background: var(--ink); } }
.loading p { margin: 0; color: var(--ink-soft); font-size: .9375rem; transition: opacity .4s var(--ease); }

.error { text-align: center; margin: 24px 0 0; }
.error p { margin: 0 0 8px; font-size: .9375rem; }

/* Day tiles */
.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tiles li { display: flex; }
.tile {
  position: relative; width: 100%; height: 100%; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  padding: 8px 2px 8px; border: 1px solid var(--hairline); border-radius: 2px; background: transparent;
  transition: background .3s var(--ease), transform .2s var(--ease);
}
button.tile:active { background: var(--paper-deep); transform: scale(.97); }
.tile .tn { font-family: var(--serif); font-size: 1.4rem; line-height: 1; }
.tile .td { font-size: .6875rem; color: var(--ink-soft); }
.tile .tdots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px; max-width: 48px; }
.tile .tdots i { width: 7px; height: 7px; border-radius: 50%; border: 1.25px solid var(--ink); }
.tile .tdots i.done { background: var(--green); }
.tile .tdots i.sq { border-radius: 1.5px; }
.tile .tdots i.missed { border-color: var(--ink-faint); }
.tile.today { border-color: var(--ink); }
.tile.today .tn::after { content: ''; display: block; height: 3px; margin: 3px -3px 0; background: var(--green); }
.tile.review { background: var(--paper-deep); border-color: transparent; }
.tile.review .rv { font-size: .6875rem; color: var(--ink-soft); margin-top: 4px; }
.tile.past .tn { color: var(--ink-soft); }

/* Intention rows */
.rows { list-style: none; margin: 20px 0 0; padding: 0; border-top: 1px solid var(--hairline); }
.row-btn { display: block; width: 100%; text-align: left; padding: 14px 0 12px; border-bottom: 1px solid var(--hairline); }
button.row-btn:active { background: rgba(20,19,16,.03); }
.row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.row-top .name { font-size: 1rem; font-weight: 500; min-width: 0; }
.row-top .name em { font-style: normal; font-weight: 400; color: var(--ink-soft); font-size: .8125rem; }
.row-top .count { font-size: .8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.row-top .count svg { width: 14px; height: 14px; }
.strip { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); height: 22px; }
.strip .c { display: grid; place-items: center; }
.strip .c.rv { background: var(--paper-deep); border-radius: 2px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); transition: background .4s var(--ease); }
.dot.done { background: var(--green); }
.dot.missed { border-color: var(--ink-faint); }
.dot.sq { border-radius: 2.5px; }
.strip .c.drop { background: var(--paper-deep); }
.dot.dragging { transform: scale(1.35); }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; margin-top: 14px; font-size: .75rem; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-block; }
.legend i.sq { border-radius: 2px; }
.legend i.done { background: var(--green); }

/* Checklist */
.items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.item { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 64px; padding: 12px 0; border-bottom: 1px solid var(--hairline); text-align: left; }
.check { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; transition: background .3s var(--ease); }
.check.sq { border-radius: 5px; }
.check svg { width: 15px; height: 15px; opacity: 0; transition: opacity .2s var(--ease); }
.item.done .check { background: var(--green); }
.item.done .check svg { opacity: 1; }
.item.pop .check { animation: pop .45s var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
.item .txt { flex: 1; min-width: 0; }
.item .nm { display: block; font-size: 1.125rem; line-height: 1.3; }
.item.done .nm { color: var(--ink-soft); }
.item .dt { display: block; font-size: .8125rem; color: var(--ink-soft); margin-top: 2px; }
.empty { text-align: center; padding: 8px 0; }
.empty .lede { margin-top: 12px; }
.quiet { text-align: center; color: var(--ink-soft); font-size: .9375rem; padding: 24px 0; margin: 0; }

.field {
  display: block; width: 100%; resize: none; min-height: 7.5rem;
  border: 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); border-radius: 0;
  background: transparent; padding: 14px 0; font-size: max(16px, 1.0625rem); line-height: 1.55;
  -webkit-user-select: text; user-select: text;
}
.field:focus { outline: none; border-color: var(--ink); }
.field::placeholder, .input::placeholder, .dock textarea::placeholder { color: var(--ink-soft); opacity: 1; }
.saved { font-size: .75rem; color: var(--ink-soft); text-align: right; min-height: 1.2em; margin-top: 6px; opacity: 0; transition: opacity .6s var(--ease); }
.saved.on { opacity: 1; }

/* Review */
.tally { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.tally li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
.tally .n { font-family: var(--serif); font-size: 1.65rem; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally .n small { font-size: 1rem; color: var(--ink-soft); }
.notes-list { list-style: none; margin: 0; padding: 0; }
.notes-list li { padding: 12px 0; border-bottom: 1px solid var(--hairline); font-size: .9375rem; }
.notes-list b { display: block; margin-bottom: 4px; font-weight: 500; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }

/* Past and settings */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.list > li { border-bottom: 1px solid var(--hairline); }
.list .sum { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; padding: 12px 0; text-align: left; }
.list .pct { font-family: var(--serif); font-size: 2rem; line-height: 1; white-space: nowrap; }
.list .when { display: block; font-size: .8125rem; color: var(--ink-soft); }
.list .ttl { display: block; font-size: 1.0625rem; }
.list .more { padding: 0 0 24px; }
.list .more p { margin: 0 0 16px; }
.setting { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 16px; min-height: 60px; padding: 8px 0; }
.setting > * { white-space: nowrap; }
.setting input[type="date"] { min-height: var(--tap); border: 0; background: none; font-size: max(16px, 1rem); text-align: right; color: var(--ink); }

/* Login and intro */
.center { min-height: calc(100dvh - var(--safe-t) - var(--safe-b) - 120px); display: flex; flex-direction: column; justify-content: center; text-align: center; }
.login .display { font-size: min(max(3.5rem, 18vw), 20vw, 4.5rem); margin-bottom: 36px; }
.login form { display: grid; gap: 16px; max-width: 300px; margin: 0 auto; width: 100%; }
.input {
  width: 100%; min-height: var(--tap); border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent;
  padding: 10px 0; font-size: max(16px, 1.125rem);
}
.input:focus { outline: none; border-bottom-width: 2px; padding-bottom: 9px; }
.login .input { text-align: center; letter-spacing: .2em; }
.intro .display { margin-bottom: 18px; }
.intro .lede { margin-bottom: 36px; }

/* Plan input, docked above the tabs and above the keyboard */
.dock {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--tabs-h) + var(--safe-b));
  background: var(--paper); border-top: 1px solid var(--hairline);
  padding: 8px var(--pad-r) 8px var(--pad-l);
}
body.kb .dock { bottom: var(--kb); }
.dock-in { max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; }
.dock textarea {
  flex: 1; min-width: 0; resize: none; max-height: 9.5rem; overflow-y: auto;
  border: 0; background: transparent; padding: 10px 0; min-height: var(--tap);
  font-family: var(--serif); font-size: clamp(17px, 1.2rem, 24px); line-height: 1.3;
  -webkit-user-select: text; user-select: text;
}
.dock textarea:focus { outline: none; }
.dock .icon-btn { border: 1px solid var(--hairline); }
.dock .send { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dock .send[disabled] { background: transparent; color: var(--ink-faint); border-color: var(--hairline); }
.dock .icon-btn svg { width: 19px; height: 19px; }
.dock .listening { border-color: var(--ink); animation: breathe 1.6s var(--ease) infinite alternate; }
.dock .offline { max-width: 560px; margin: 0 auto 4px; font-size: .8125rem; color: var(--ink-soft); }
@keyframes breathe { from { box-shadow: 0 0 0 0 rgba(20,19,16,.14); } to { box-shadow: 0 0 0 8px rgba(20,19,16,0); } }

/* Tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(245,243,236,.96); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--hairline);
  padding: 0 var(--safe-r) var(--safe-b) var(--safe-l);
}
body.kb nav.tabs, body.no-tabs nav.tabs { display: none; }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button {
  position: relative; height: var(--tabs-h);
  font-size: .6875rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft);
}
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"]::before { content: ''; position: absolute; top: -1px; left: 50%; width: 22px; margin-left: -11px; height: 3px; background: var(--green); }

/* Toast */
.toast {
  position: fixed; z-index: 40; left: var(--pad-l); right: var(--pad-r);
  bottom: calc(var(--tabs-h) + var(--safe-b) + var(--dock-h) + 12px);
  max-width: 528px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 52px; padding: 4px 6px 4px 16px; border-radius: 2px;
  background: var(--ink); color: var(--paper); font-size: .9375rem;
  animation: rise .35s var(--ease) both;
}
body.no-tabs .toast { bottom: calc(var(--safe-b) + 16px); }
.toast button { min-height: var(--tap); padding: 0 12px; color: var(--green); font-weight: 500; font-size: .8125rem; letter-spacing: .14em; text-transform: uppercase; }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20,19,16,.32); animation: fade .3s var(--ease) both; }
.sheet {
  position: fixed; left: 0; right: 0; z-index: 51; bottom: var(--kb);
  max-height: calc(100dvh - var(--safe-t) - 16px - var(--kb)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-top-left-radius: 8px; border-top-right-radius: 8px;
  padding: 0 var(--pad-r) calc(var(--safe-b) + 16px) var(--pad-l);
  animation: up .38s var(--ease) both;
}
.sheet-in { max-width: 560px; margin: 0 auto; }
.sheet-handle { display: flex; justify-content: center; align-items: center; height: 28px; cursor: grab; touch-action: none; }
.sheet-handle::before { content: ''; width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sheet h2 { font-family: var(--serif); font-size: 1.6rem; line-height: 1.1; }
.sheet h2:focus { outline: none; }
.sheet .form { display: grid; gap: 18px; padding-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); border: 1px solid var(--ink); border-radius: 2px; }
.seg button { min-height: var(--tap); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stepper { display: flex; align-items: center; justify-content: space-between; }
.stepper .ctl { display: flex; align-items: center; gap: 10px; }
.stepper .val { font-family: var(--serif); font-size: 1.75rem; min-width: 2ch; text-align: center; }
.stepper .icon-btn { border: 1px solid var(--ink); font-size: 1.25rem; }
.stepper .icon-btn[disabled] { opacity: .3; }
.pick { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick button, .pick .rvd {
  width: 100%; min-height: 74px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid var(--hairline); border-radius: 2px;
}
.pick .pn { font-family: var(--serif); font-size: 1.2rem; line-height: 1; }
.pick .pd { font-size: .6875rem; color: var(--ink-soft); }
.pick .dot { width: 11px; height: 11px; }
.pick .dot.empty { border-color: transparent; }
.pick button.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick button.sel .pd { color: rgba(245,243,236,.8); }
.pick button.sel .dot { border-color: var(--paper); }
.pick .rvd { background: var(--paper-deep); border-color: transparent; color: var(--ink-soft); font-size: .6875rem; }
.pick-hint { margin: 10px 0 0; font-size: .875rem; color: var(--ink-soft); min-height: 1.4em; text-align: center; }
.menu { list-style: none; margin: 0 0 8px; padding: 0; border-top: 1px solid var(--hairline); }
.menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; min-height: 60px; font-size: 1.0625rem; border-bottom: 1px solid var(--hairline); text-align: left; }
.menu svg { width: 18px; height: 18px; color: var(--ink-soft); }

.fade { animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }

@media (min-width: 700px) {
  .tile { min-height: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .loading .dots i:nth-child(-n+4) { background: var(--ink); }
}
</style>
</head>
<body>
<header class="bar" id="bar"><div class="bar-in" id="barIn"></div></header>
<main id="main" tabindex="-1"></main>
<section class="dock" id="dock" aria-label="Talk to Claude" hidden></section>
<nav class="tabs" id="tabs" aria-label="Tabs" hidden>
  <div class="in">
    <button data-tab="today">Today</button>
    <button data-tab="span">Deka</button>
    <button data-tab="plan">Plan</button>
  </div>
</nav>
<div id="toastRoot" aria-live="polite" role="status"></div>
<div id="sheetRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* Storage */

// Data saved before the rename lives under the old key. It is copied to the
// new key once and left in place, so it stays readable.
const KEY = 'deka.v1';
const OLD_KEY = 'span.v1';
const blank = () => ({ v: 1, current: null, next: null, spans: [] });
let S = load();

function load() {
  try {
    let raw = localStorage.getItem(KEY);
    if (!raw) {
      raw = localStorage.getItem(OLD_KEY);
      if (raw) localStorage.setItem(KEY, raw);
    }
    if (!raw) return blank();
    const d = JSON.parse(raw);
    return isState(d) ? d : blank();
  } catch { return blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}
// Paint first, write after.
let saveTimer = null;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 0); }
function isState(d) {
  return d && typeof d === 'object' && d.v === 1 && Array.isArray(d.spans);
}
// People who already have data never see the intro.
if (!S.seen && (S.spans.length || (S.current && S.current.intentions.length))) S.seen = true;

/* Dates. The UI never names weekdays; Claude gets them. */

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayIso = () => iso(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmt = s => { const d = parse(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const range = start => `${fmt(start)} to ${fmt(addDays(start, 9))}`;
const dayDate = (span, n) => addDays(span.start, n - 1);
const dayNum = span => diffDays(span.start, todayIso()) + 1;
function dayMap(start) {
  return Array.from({ length: 10 }, (_, i) => {
    const date = addDays(start, i);
    return { day: i + 1, date, weekday: WEEKDAYS[parse(date).getDay()] };
  });
}

/* Helpers */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Glue the last two words so a line never ends on a lone word.
const nb = s => esc(s).replace(/ (\S+)$/, '&nbsp;$1');
const nbRaw = s => String(s).replace(/ (\S+)$/, ' $1');
const uid = () => Math.random().toString(36).slice(2, 9);
const slug = s => (s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'item').slice(0, 24);
const clone = o => JSON.parse(JSON.stringify(o));

function newSpan(start) {
  return { id: uid(), start, status: 'planning', intentions: [], occurrences: [], notes: {}, log: [], note: '', question: '', reflection: '', review: '' };
}
const occOf = (span, iid) => span.occurrences.filter(o => o.intention_id === iid);
const findOcc = (span, iid, day) => span.occurrences.find(o => o.intention_id === iid && o.day === day);
const nameOf = (span, iid) => (span.intentions.find(i => i.id === iid) || { name: iid }).name;
function syncTargets(span) {
  for (const it of span.intentions) it.target = occOf(span, it.id).length;
}
// Even spread of n occurrences over the open days.
function spread(n, from = 1) {
  const days = [];
  for (let d = Math.max(1, from); d <= 9; d++) days.push(d);
  if (n >= days.length) return days;
  const out = [];
  for (let i = 0; i < n; i++) out.push(days[Math.floor((i + .5) * days.length / n)]);
  return out;
}
// The free day with the lightest load, as far as possible from the intention's other days.
function bestFreeDay(span, taken, from) {
  let best = null, bestScore = -Infinity;
  for (let d = Math.max(1, from); d <= 9; d++) {
    if (taken.includes(d)) continue;
    const load = span.occurrences.filter(o => o.day === d).length;
    const gap = taken.length ? Math.min(...taken.map(t => Math.abs(t - d))) : 5;
    const score = gap * 2 - load;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}
const openFrom = span => span.status === 'live' ? Math.min(9, Math.max(1, dayNum(span))) : 1;
function summary(span) {
  const parts = span.intentions.map(it => {
    const occ = occOf(span, it.id);
    return `${it.name} ${occ.filter(o => o.done).length}/${occ.length}`;
  });
  const bits = [`Deka ${range(span.start)}: ${parts.join(', ') || 'nothing planned'}.`];
  if (span.reflection) bits.push(`Their reflection: ${span.reflection}`);
  if (span.review) bits.push(`Your read: ${span.review}`);
  return bits.join(' ');
}
function completion(span) {
  const all = span.occurrences.length;
  return all ? Math.round(100 * span.occurrences.filter(o => o.done).length / all) : 0;
}
function planState(span) {
  return {
    intentions: span.intentions.map(({ id, name, type, tag, target }) => ({ id, name, type, tag: tag || '', target })),
    occurrences: span.occurrences.map(({ intention_id, day, done, detail }) => ({ intention_id, day, done: Boolean(done), detail: detail || '' })),
    notes: span.notes,
  };
}
function applyPlan(span, p) {
  const prev = new Map(span.occurrences.map(o => [`${o.intention_id}@${o.day}`, o]));
  span.intentions = p.intentions.map(it => ({ ...it }));
  span.occurrences = p.occurrences.map(o => ({
    intention_id: o.intention_id, day: o.day, detail: o.detail,
    done: Boolean(prev.get(`${o.intention_id}@${o.day}`)?.done),
  }));
  span.note = p.note;
  span.question = p.question;
}
const spanFor = t => t === 'next' ? S.next : S.current;
const nextStart = () => { const s = addDays(S.current.start, 10); return s < todayIso() ? todayIso() : s; };

/* Icons */

const I = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#141310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 19h4L19 9l-4-4L5 15v4z"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* API */

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { ui.locked = true; render(); }
  if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
  return data;
}

function askClaude(mode, span, message, extra = {}) {
  const today = todayIso();
  return api('/api/plan', {
    mode,
    message,
    today: `${WEEKDAYS[new Date().getDay()]} ${today}`,
    currentDay: span.status === 'live' ? dayNum(span) : null,
    days: dayMap(extra.start || span.start),
    plan: planState(span),
    history: (extra.log || span.log).slice(-10),
    past: S.spans.slice(0, 3).map(summary),
    reflection: extra.reflection || '',
  }).then(r => r.plan);
}

/* UI state, not saved */

const ui = {
  tab: 'today',
  sub: null,        // 'day' | 'past' | 'settings'
  day: null,
  scroll: {},
  busy: null,       // { kind, t0, waking }
  error: null,      // { text, label, fn }
  moved: '',
  undo: null,
  locked: false,
  awake: false,
  sheet: null,
  openPast: null,
  pop: null,
};

const $ = id => document.getElementById(id);
const $bar = $('barIn'), $main = $('main'), $dock = $('dock'), $tabs = $('tabs'), $toast = $('toastRoot'), $sheet = $('sheetRoot');

/* Pieces */

function loadingView() {
  return `<div class="loading fade"><div class="dots" aria-hidden="true">${'<i></i>'.repeat(10)}</div><p id="stage">${esc(stageText())}</p></div>`;
}

function errorView() {
  if (!ui.error) return '';
  return `<div class="error" role="alert"><p>${nb(ui.error.text)}</p>
    <button class="btn" data-a="error-act">${esc(ui.error.label)}</button></div>`;
}

function dotsFor(span, day, live, today) {
  const order = new Map(span.intentions.map((it, i) => [it.id, i]));
  return span.occurrences.filter(o => o.day === day)
    .sort((a, b) => order.get(a.intention_id) - order.get(b.intention_id))
    .map(o => {
      const it = span.intentions.find(x => x.id === o.intention_id) || {};
      const missed = live && !o.done && day < today;
      return `<i class="${o.done ? 'done' : ''}${it.type === 'abstain' ? ' sq' : ''}${missed ? ' missed' : ''}"></i>`;
    }).join('');
}

function tiles(span, { live = false } = {}) {
  const today = live ? dayNum(span) : 0;
  let h = '<ol class="tiles" aria-label="Days">';
  for (let d = 1; d <= 10; d++) {
    const occ = span.occurrences.filter(o => o.day === d);
    const done = occ.filter(o => o.done).length;
    const date = fmt(dayDate(span, d));
    const cls = ['tile', d === today ? 'today' : '', d === 10 ? 'review' : '', live && d < today ? 'past' : ''].join(' ');
    const label = d === 10 ? `Day 10, ${date}, review` : `Day ${d}, ${date}, ${live ? `${done} of ${occ.length} done` : `${occ.length} planned`}${d === today ? ', today' : ''}`;
    const inner = `<span class="tn" aria-hidden="true">${d}</span><span class="td" aria-hidden="true">${parse(dayDate(span, d)).getDate()}</span>` +
      (d === 10 ? '<span class="rv" aria-hidden="true">Review</span>' : `<span class="tdots" aria-hidden="true">${dotsFor(span, d, live, today)}</span>`);
    h += live
      ? `<li><button class="${cls}" data-a="open-day" data-day="${d}" aria-label="${esc(label)}">${inner}</button></li>`
      : `<li><div class="${cls}" role="img" aria-label="${esc(label)}">${inner}</div></li>`;
  }
  return h + '</ol>';
}

function rows(span, { live = false, editable = false, target = 'current' } = {}) {
  const today = live ? dayNum(span) : 0;
  let h = '<ul class="rows">';
  for (const it of span.intentions) {
    const occ = occOf(span, it.id);
    const done = occ.filter(o => o.done).length;
    let strip = '';
    for (let d = 1; d <= 10; d++) {
      const o = findOcc(span, it.id, d);
      const dot = o ? `<span class="dot${o.done ? ' done' : ''}${it.type === 'abstain' ? ' sq' : ''}${live && !o.done && d < today ? ' missed' : ''}" data-iid="${esc(it.id)}" data-day="${d}"></span>` : '';
      strip += `<span class="c${d === 10 ? ' rv' : ''}" data-day="${d}">${dot}</span>`;
    }
    const count = live ? `${done} of ${occ.length}` : `${occ.length}×`;
    const days = occ.map(o => o.day).sort((a, b) => a - b).join(', ');
    const inner = `<span class="row-top"><span class="name">${nb(it.name)}${it.tag ? `&nbsp;&nbsp;<em>${esc(it.tag)}</em>` : ''}</span>
      <span class="count">${count}${editable ? I.edit : ''}</span></span><span class="strip" aria-hidden="true" data-iid="${esc(it.id)}">${strip}</span>`;
    const label = `${it.name}, ${live ? `${done} of ${occ.length} done` : `${occ.length} times`}, days ${days}`;
    h += editable
      ? `<li><button class="row-btn" data-a="edit-int" data-t="${target}" data-iid="${esc(it.id)}" aria-label="${esc(`Edit ${label}`)}">${inner}</button></li>`
      : `<li><div class="row-btn" role="img" aria-label="${esc(label)}">${inner}</div></li>`;
  }
  h += '</ul>';
  if (span.intentions.length) h += '<div class="legend" aria-hidden="true"><span><i></i>Do or see</span><span><i class="sq"></i>Hold back</span><span><i class="done"></i>Done</span></div>';
  return h;
}

function planBlock(span, target, { live = false } = {}) {
  return tiles(span, { live }) + rows(span, { live, editable: true, target }) +
    `<div class="actions" style="margin-top:14px"><button class="link" data-a="add-int" data-t="${target}">Add an intention</button></div>`;
}

function itemsView(span, day) {
  const occ = span.occurrences.filter(o => o.day === day);
  if (!occ.length) return `<p class="quiet">${day === 10 ? 'Review day.' : 'Nothing planned. A free&nbsp;day.'}</p>`;
  const order = new Map(span.intentions.map((it, i) => [it.id, i]));
  occ.sort((a, b) => order.get(a.intention_id) - order.get(b.intention_id));
  return '<ul class="items">' + occ.map(o => {
    const it = span.intentions.find(x => x.id === o.intention_id) || { name: o.intention_id };
    const sub = [o.detail, it.tag].filter(Boolean).join(', ');
    const key = `${o.intention_id}@${day}`;
    return `<li><button class="item${o.done ? ' done' : ''}${ui.pop === key ? ' pop' : ''}" data-a="toggle" data-iid="${esc(o.intention_id)}" data-day="${day}" role="checkbox" aria-checked="${Boolean(o.done)}">
      <span class="check${it.type === 'abstain' ? ' sq' : ''}">${I.check}</span>
      <span class="txt"><span class="nm">${esc(it.name)}</span>${sub ? `<span class="dt">${esc(sub)}</span>` : ''}</span></button></li>`;
  }).join('') + '</ul>';
}

function notesField(span, day, label, placeholder) {
  return `<div class="section"><label class="label" for="note-${day}">${label}</label>
    <textarea class="field" id="note-${day}" data-note="${day}" placeholder="${esc(nbRaw(placeholder))}">${esc(span.notes[day] || '')}</textarea>
    <div class="saved" id="saved-${day}" aria-hidden="true">Saved</div></div>`;
}

function empty(title, lede, button, action, extra = '') {
  return `<div class="empty center fade"><h1 class="display small">${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}
    <div class="actions">${button ? `<button class="btn primary" data-a="${action}">${button}</button>` : ''}${extra}</div></div>`;
}

/* Screens */

function introView() {
  return `<div class="intro center fade">
    <div class="eyebrow">Deka</div>
    <h1 class="display" style="margin-top:14px">Ten days at a&nbsp;time.</h1>
    <p class="lede">A deka is 10 days. Nine to live the plan, one to look&nbsp;back.</p>
    <div class="actions"><button class="btn primary block" data-a="intro-start">Plan my first&nbsp;deka</button></div></div>`;
}

function loginView() {
  return `<div class="login center fade"><h1 class="display">Deka</h1>
    <form data-form="login" autocomplete="on"><label class="sr" for="pass">Passcode</label>
      <input class="input" id="pass" type="password" autocomplete="current-password" placeholder="Passcode" required>
      ${ui.loginError ? `<p class="error" role="alert" style="margin:0">${esc(ui.loginError)}</p>` : ''}
      <button class="btn primary block" type="submit">Enter</button></form></div>`;
}

function todayTab() {
  const cur = S.current;
  if (!cur || cur.status !== 'live') {
    if (cur && cur.intentions.length) return empty('Your plan is&nbsp;ready', 'Look it over, then&nbsp;accept.', 'Open plan', 'go-plan');
    return empty('No deka&nbsp;yet', 'Tell Claude what the next 10 days&nbsp;hold.', 'Plan', 'go-plan');
  }
  const n = dayNum(cur);
  if (n < 1) {
    return `<div class="head fade"><div class="eyebrow">Starts ${fmt(cur.start)}</div><h1 class="display small">Your next deka is&nbsp;set.</h1></div>` + tiles(cur) + rows(cur);
  }
  if (n >= 10) return reviewView(cur);
  const mine = cur.occurrences.filter(o => o.day === n);
  let h = `<div class="head fade"><div class="eyebrow">Today · ${fmt(todayIso())}</div><h1 class="display">Day ${n}</h1>
    ${mine.length ? `<p class="sub">${mine.filter(o => o.done).length} of ${mine.length} done</p>` : ''}</div>`;
  h += itemsView(cur, n);
  h += notesField(cur, n, 'Thoughts', 'Anything on your mind.');
  h += rebalanceBlock();
  return h;
}

function rebalanceBlock() {
  let h = '<div class="actions">';
  h += ui.busy && ui.busy.kind === 'rebalance' ? loadingView() : '<button class="btn" data-a="rebalance">Rebalance</button>';
  h += '</div>';
  if (ui.moved) h += `<p class="moved fade">${nb(ui.moved)}</p>${ui.undo ? '<div class="actions" style="margin-top:0"><button class="link" data-a="undo-rebalance">Undo</button></div>' : ''}`;
  if (ui.error && ui.error.where === 'rebalance') h += errorView();
  return h;
}

function dayView(span, d) {
  const occ = span.occurrences.filter(o => o.day === d);
  let h = `<div class="head fade"><div class="eyebrow">${d === dayNum(span) ? 'Today' : d === 10 ? 'Review day' : fmt(dayDate(span, d))}</div>

/* Claude */

const STAGES = {
  plan: ['Reading what you wrote', 'Spreading it over nine days', 'Checking the load', 'Almost there'],
  refine: ['Reading your change', 'Adjusting the plan', 'Almost there'],
  rebalance: ['Looking at what was missed', 'Moving things forward', 'Almost there'],
  review: ['Reading your deka', 'Drafting the next one', 'Almost there'],
};
const STAGE_AT = [0, 4000, 10000, 20000];
function stageText() {
  const b = ui.busy;
  if (!b) return '';
  if (b.waking) return 'Waking up';
  const list = STAGES[b.kind] || STAGES.plan;
  const t = Date.now() - b.t1;
  let i = 0;
  while (i + 1 < list.length && t >= STAGE_AT[i + 1]) i++;
  return list[i];
}
let stageTimer = null;
function tickStage() {
  const el = $('stage');
  if (el && el.textContent !== stageText()) el.textContent = stageText();
}

// One shared session check. The first Claude call waits on it. "Waking up"
// appears only if that check is still pending after a moment, and once shown
// it stays long enough to read, so a fast reply never makes it flash.
let waking = null;
function wake() {
  if (!waking) waking = api('/api/session').then(r => { ui.awake = true; return r; }, err => { waking = null; throw err; });
  return waking;
}
const WAKE_DELAY = 800;
const WAKE_MIN = 700;

async function run(kind, fn, where = '') {
  ui.busy = { kind, t0: Date.now(), t1: Date.now(), waking: false }; ui.error = null;
  render();
  stageTimer = setInterval(tickStage, 500);
  let timer = null;
  const retry = () => run(kind, fn, where);
  try {
    if (!ui.awake) {
      let shownAt = 0;
      timer = setTimeout(() => {
        if (ui.awake || !ui.busy) return;
        ui.busy.waking = true; shownAt = Date.now(); tickStage();
      }, WAKE_DELAY);
      await wake();
      clearTimeout(timer);
      if (shownAt) await new Promise(r => { timer = setTimeout(r, Math.max(0, WAKE_MIN - (Date.now() - shownAt))); });
      if (ui.busy) { ui.busy.waking = false; ui.busy.t1 = Date.now(); tickStage(); }
    }
    await fn();
  } catch (err) {
    if (err.status === 401) return;
    const byHand = () => openNew(where === 'next' ? 'next' : 'current');
    const planning = kind === 'plan' || kind === 'refine';
    ui.error = err.status === 503
      ? { text: 'Claude is not set up yet.', label: 'Plan by hand', fn: byHand, where }
      : err.status === 429 ? { text: 'Too many tries. Wait a few minutes.', label: 'Try again', fn: retry, where }
      : navigator.onLine === false
        ? (planning ? { text: 'You are offline.', label: 'Plan by hand', fn: byHand, where } : { text: 'You are offline.', label: 'Try again', fn: retry, where })
      : { text: 'Claude did not answer.', label: 'Try again', fn: retry, where };
  } finally {
    clearTimeout(timer);
    clearInterval(stageTimer);
    ui.busy = null;
    render();
  }
}

function send(target, text) {
  const span = spanFor(target);
  const live = span.status === 'live';
  const mode = span.intentions.length ? 'refine' : 'plan';
  const before = clone({ i: span.intentions, o: span.occurrences, n: span.note, q: span.question });
  span.log.push({ role: 'user', text });
  run(mode, async () => {
    const p = await askClaude(mode, span, text);
    applyPlan(span, p);
    span.log.push({ role: 'claude', text: [p.note, p.question].filter(Boolean).join(' ') });
    if (live) {
      span.liveNote = p.note;
      toast('Plan updated.', () => { Object.assign(span, { intentions: before.i, occurrences: before.o, note: before.n, question: before.q, liveNote: '' }); render(); });
    }
  }, target);
}

function rebalance() {
  const span = S.current;
  const before = clone({ i: span.intentions, o: span.occurrences });
  ui.moved = ''; ui.undo = null;
  run('rebalance', async () => {
    const p = await askClaude('rebalance', span, 'Rebalance what is left.');
    applyPlan(span, p);
    span.question = '';
    ui.moved = p.note || 'Rebalanced.';
    ui.undo = before;
  }, 'rebalance');
}

function readSpan() {
  const span = S.current;
  const start = nextStart();
  run('review', async () => {
    const p = await askClaude('review', span, 'Review this deka and draft the next one.', { start, reflection: span.reflection, log: [] });
    span.review = p.review;
    const next = newSpan(start);
    applyPlan(next, p);
    next.log.push({ role: 'claude', text: [p.note, p.question].filter(Boolean).join(' ') });
    S.next = next;
  }, 'review');
}

function closeCurrent() {
  const cur = S.current;
  cur.status = 'done';
  cur.closed = todayIso();
  S.spans.unshift(cur);
}

/* Intention editing */

function openEdit(target, iid) { ui.sheet = { kind: 'edit', target, iid, sel: null, confirmDelete: false }; renderSheet(); focusSheet(); }
function openNew(target) {
  const span = spanFor(target) || (S.current = newSpan(todayIso()));
  const from = openFrom(span);
  ui.sheet = { kind: 'new', target, sel: null, draft: { name: '', type: 'do', days: spread(3, from) } };
  renderSheet(); focusSheet(true);
}
function focusSheet(name) {
  requestAnimationFrame(() => {
    const el = name ? $('intName') : $('sheetTitle');
    if (el) { if (!name) el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }); }
  });
}
function closeSheet() {
  const sh = ui.sheet;
  ui.sheet = null;
  if (sh && sh.kind === 'edit') {
    const span = spanFor(sh.target);
    const it = span && span.intentions.find(x => x.id === sh.iid);
    if (it && !it.name.trim()) it.name = 'Untitled';
  }
  render();
}

function sheetCount(delta) {
  const sh = ui.sheet;
  const span = spanFor(sh.target);
  const from = openFrom(span);
  const days = sheetDays(sh);
  if (delta > 0 && days.length < 9) {
    const d = bestFreeDay(span, days, from) || bestFreeDay(span, days, 1);
    if (!d) return;
    if (sh.kind === 'new') sh.draft.days.push(d);
    else { span.occurrences.push({ intention_id: sh.iid, day: d, done: false, detail: '' }); syncTargets(span); }
  } else if (delta < 0 && days.length > 1) {
    if (sh.kind === 'new') { sh.draft.days.sort((a, b) => a - b).pop(); }
    else {
      const occ = occOf(span, sh.iid).filter(o => !o.done).sort((a, b) => b.day - a.day);
      if (!occ.length) return;
      span.occurrences = span.occurrences.filter(o => o !== occ[0]);
      syncTargets(span);
    }
  }
  sh.sel = null;
  render();
}

function sheetPick(day) {
  const sh = ui.sheet;
  const span = spanFor(sh.target);
  const days = sheetDays(sh);
  const on = days.includes(day);
  if (sh.sel === day) sh.sel = null;
  else if (sh.sel && !on) {
    if (sh.kind === 'new') sh.draft.days = days.map(d => d === sh.sel ? day : d);
    else { const o = findOcc(span, sh.iid, sh.sel); if (o) o.day = day; }
    sh.sel = null;
  } else if (on) sh.sel = day;
  else {
    if (days.length >= 9) return;
    if (sh.kind === 'new') sh.draft.days.push(day);
    else { span.occurrences.push({ intention_id: sh.iid, day, done: false, detail: '' }); syncTargets(span); }
  }
  render();
}

function sheetRemove() {
  const sh = ui.sheet;
  const span = spanFor(sh.target);
  if (!sh.sel || sheetDays(sh).length <= 1) return;
  if (sh.kind === 'new') sh.draft.days = sh.draft.days.filter(d => d !== sh.sel);
  else { span.occurrences = span.occurrences.filter(o => !(o.intention_id === sh.iid && o.day === sh.sel)); syncTargets(span); }
  sh.sel = null;
  render();
}

function deleteIntention() {
  const sh = ui.sheet;
  if (!sh.confirmDelete) { sh.confirmDelete = true; renderSheet(); setTimeout(() => { if (ui.sheet === sh && sh.confirmDelete) { sh.confirmDelete = false; renderSheet(); } }, 3000); return; }
  const span = spanFor(sh.target);
  const before = clone({ i: span.intentions, o: span.occurrences });
  const name = nameOf(span, sh.iid);
  span.intentions = span.intentions.filter(it => it.id !== sh.iid);
  span.occurrences = span.occurrences.filter(o => o.intention_id !== sh.iid);
  ui.sheet = null;
  render();
  toast(`${name} deleted.`, () => { span.intentions = before.i; span.occurrences = before.o; render(); });
}

function addFromSheet() {
  const sh = ui.sheet;
  const name = sh.draft.name.trim();
  if (!name) return;
  const span = spanFor(sh.target);
  let id = slug(name);
  while (span.intentions.some(it => it.id === id)) id += '_' + uid().slice(0, 2);
  span.intentions.push({ id, name, type: sh.draft.type, tag: '', target: sh.draft.days.length });
  for (const d of sh.draft.days) span.occurrences.push({ intention_id: id, day: d, done: false, detail: '' });
  ui.sheet = null;
  render();
  toast(`${name} added.`);
}

/* Check off */

function toggle(iid, day) {
  const span = S.current;
  const o = findOcc(span, iid, day);
  if (!o) return;
  o.done = !o.done;
  if (o.done) {
    ui.pop = `${iid}@${day}`;
    if (navigator.vibrate) navigator.vibrate(8);
  }
  render();
  if (o.done) toast(`${nameOf(span, iid)} done.`, () => { o.done = false; render(); });
}

/* Events */

document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    if (ui.sub && history.state && history.state.sub) history.replaceState(null, '');
    go(tab.dataset.tab);
    return;
  }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  switch (a) {
    case 'intro-start': S.seen = true; if (!S.current) S.current = newSpan(todayIso()); go('plan'); break;
    case 'error-act': { const f = ui.error && ui.error.fn; ui.error = null; if (f) f(); else render(); break; }
    case 'mic': listen(el); break;
    case 'go-plan': go('plan'); break;
    case 'go-today': go('today'); break;
    case 'more': ui.sheet = { kind: 'more' }; renderSheet(); focusSheet(); break;
    case 'go-past': ui.sheet = null; openSub('past'); break;
    case 'go-settings': ui.sheet = null; openSub('settings'); break;
    case 'back': history.state && history.state.sub ? history.back() : closeSub(); break;
    case 'sheet-close': closeSheet(); break;
    case 'add-int': openNew(el.dataset.t || 'current'); break;
    case 'edit-int': openEdit(el.dataset.t, el.dataset.iid); break;
    case 'sheet-type': {
      const sh = ui.sheet;
      if (sh.kind === 'new') sh.draft.type = el.dataset.v;
      else { const it = spanFor(sh.target).intentions.find(x => x.id === sh.iid); if (it) it.type = el.dataset.v; }
      render(); break;
    }
    case 'sheet-count': sheetCount(Number(el.dataset.v)); break;
    case 'pick': sheetPick(Number(el.dataset.day)); break;
    case 'pick-remove': sheetRemove(); break;
    case 'delete-int': deleteIntention(); break;
    case 'toast-undo': { const f = ui.toastUndo; hideToast(); if (f) f(); break; }
    case 'start-over': {
      if (!confirm('Clear this plan and start again?')) return;
      const span = spanFor(el.dataset.t);
      Object.assign(span, { intentions: [], occurrences: [], log: [], note: '', question: '' });
      render(); break;
    }
    case 'accept':
      Object.assign(S.current, { status: 'live', log: [], note: '', question: '' });
      go('today'); toast('Deka started.'); break;
    case 'accept-next':
      closeCurrent();
      S.current = S.next; Object.assign(S.current, { status: 'live', log: [], note: '', question: '' }); S.next = null;
      go('today'); toast('Next deka started.'); break;
    case 'toggle': toggle(el.dataset.iid, Number(el.dataset.day)); break;
    case 'open-day': openSub('day', Number(el.dataset.day)); break;
    case 'rebalance': rebalance(); break;
    case 'undo-rebalance':
      if (ui.undo) { S.current.intentions = ui.undo.i; S.current.occurrences = ui.undo.o; ui.undo = null; ui.moved = ''; render(); }
      break;
    case 'read-span': readSpan(); break;
    case 'next-by-hand': {
      const start = nextStart();
      closeCurrent(); S.current = newSpan(start); S.next = null;
      go('plan'); openNew('current'); break;
    }
    case 'open-past': ui.openPast = ui.openPast === el.dataset.id ? null : el.dataset.id; render(); break;
    case 'export': exportData(); break;
    case 'import': $('importFile').click(); break;
    case 'discard':
      if (!confirm('Discard this deka? Past dekas stay.')) return;
      S.current = null; S.next = null; closeSub(); go('today'); break;
    case 'lock': api('/api/logout', {}).catch(() => {}).finally(() => { ui.locked = true; ui.loginError = ''; ui.sub = null; render(); }); break;
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'login') {
    const pass = $('pass').value;
    api('/api/login', { passcode: pass })
      .then(() => { ui.locked = false; ui.loginError = ''; ui.awake = true; render(); })
      .catch(err => { ui.loginError = err.status === 429 ? 'Too many tries. Wait a few minutes.' : err instanceof TypeError ? 'No connection. Try again.' : 'Wrong passcode.'; render(); $('pass')?.focus(); });
    return;
  }
  if (kind === 'sheet') { if (ui.sheet && ui.sheet.kind === 'new') addFromSheet(); else closeSheet(); return; }
  const ta = $('msg');
  const text = ta.value.trim();
  if (!text || ui.busy || navigator.onLine === false) return;
  if (rec) { rec.stop(); rec = null; }
  ta.value = '';
  autosize(ta);
  ta.blur();
  send(form.dataset.t, text);
});

let noteTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'msg') {
    autosize(t);
    $dock.querySelector('.send').disabled = !t.value.trim() || Boolean(ui.busy) || navigator.onLine === false;
    setDockHeight();
    return;
  }
  if (t.id === 'intName' && ui.sheet) {
    const sh = ui.sheet;
    if (sh.kind === 'new') { sh.draft.name = t.value; $('sheetAdd').disabled = !t.value.trim(); }
    else {
      const it = spanFor(sh.target).intentions.find(x => x.id === sh.iid);
      if (it) { it.name = t.value; saveSoon(); }
    }
    return;
  }
  if (t.dataset && t.dataset.note) {
    S.current.notes[t.dataset.note] = t.value;
    flashSaved(`saved-${t.dataset.note}`);
  } else if (t.hasAttribute && t.hasAttribute('data-reflection')) {
    S.current.reflection = t.value;
    flashSaved('saved-reflection');
  }
});

function flashSaved(id) {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    save();
    const el = $(id);
    if (!el) return;
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 1400);
  }, 400);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'msg') {
    e.preventDefault();
    e.target.closest('form').requestSubmit();
  }
  if (e.key === 'Enter' && e.target.id === 'intName') {
    e.preventDefault();
    if (ui.sheet && ui.sheet.kind === 'new') addFromSheet(); else e.target.blur();
  }
  if (e.key === 'Escape' && ui.sheet) closeSheet();
});

document.addEventListener('change', e => {
  if (e.target.id === 'startDate' && e.target.value && S.current) { S.current.start = e.target.value; saveSoon(); }
  if (e.target.id === 'importFile') importData(e.target.files[0]);
});

window.addEventListener('online', renderDock);
window.addEventListener('offline', renderDock);

/* Header hairline once the page scrolls */
const $barEl = $('bar');
window.addEventListener('scroll', () => $barEl.classList.toggle('scrolled', window.scrollY > 4), { passive: true });

/* Keyboard: keep the Plan input and the sheet above it */
const vv = window.visualViewport;
function onViewport() {
  if (!vv) return;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', `${Math.round(kb)}px`);
  document.body.classList.toggle('kb', kb > 80);
  setDockHeight();
}
if (vv) { vv.addEventListener('resize', onViewport); vv.addEventListener('scroll', onViewport); }

/* Sheet: drag the handle down to close */
let sheetDrag = null;
document.addEventListener('pointerdown', e => {
  if (e.target.id === 'sheetHandle') {
    sheetDrag = { y: e.clientY, el: $('sheet') };
    e.target.setPointerCapture(e.pointerId);
  }
});
document.addEventListener('pointermove', e => {
  if (!sheetDrag) return;
  const dy = Math.max(0, e.clientY - sheetDrag.y);
  sheetDrag.el.style.transform = `translateY(${dy}px)`;
});
document.addEventListener('pointerup', e => {
  if (!sheetDrag) return;
  const dy = e.clientY - sheetDrag.y;
  const el = sheetDrag.el; sheetDrag = null;
  if (dy > 80) closeSheet(); else el.style.transform = '';
});

/* Desktop only: drag a dot along its row to move it. Touch uses the sheet. */
let drag = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  const dot = e.target.closest('.strip .dot');
  if (!dot || !dot.closest('button.row-btn')) return;
  drag = { dot, iid: dot.dataset.iid, day: Number(dot.dataset.day), x: e.clientX, moved: false, over: null, strip: dot.closest('.strip'), target: dot.closest('button').dataset.t };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientX - drag.x) < 6) return;
  drag.moved = true;
  drag.dot.classList.add('dragging');
  drag.dot.style.transform = `translate(${e.clientX - drag.x}px, 0) scale(1.35)`;
  let over = null;
  for (const c of drag.strip.children) { const r = c.getBoundingClientRect(); if (e.clientX >= r.left && e.clientX < r.right) over = c; }
  if (drag.over && drag.over !== over) drag.over.classList.remove('drop');
  drag.over = over;
  if (over) over.classList.add('drop');
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  const span = spanFor(d.target);
  const to = d.over ? Number(d.over.dataset.day) : d.day;
  if (to !== d.day && to <= 9 && !findOcc(span, d.iid, to)) { const o = findOcc(span, d.iid, d.day); if (o) o.day = to; }
  render();
});

/* Voice */

function listen(btn) {
  if (!SR) return;
  if (rec) { rec.stop(); return; }
  const ta = $('msg');
  const base = ta.value ? ta.value.trim() + ' ' : '';
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = ev => {
    let text = '';
    for (const r of ev.results) text += r[0].transcript;
    ta.value = base + text.trim();
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onend = () => { rec = null; btn.classList.remove('listening'); };
  rec.onerror = () => { rec = null; btn.classList.remove('listening'); ta.focus(); };
  btn.classList.add('listening');
  try { rec.start(); } catch { rec = null; btn.classList.remove('listening'); ta.focus(); }
}

/* Export and import */

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `deka-${todayIso()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!isState(d)) throw new Error('shape');
      if (!confirm('Replace everything on this device with this file?')) return;
      S = d;
      if (!S.seen && (S.spans.length || (S.current && S.current.intentions.length))) S.seen = true;
      ui.sub = null; go('today'); toast('Imported.');
    } catch { toast('That file is not a Deka export.'); }
    $('importFile').value = '';
  };
  r.readAsText(file);
}

/* Boot: draw from local data first, then check the session. */

document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.activeElement?.matches('textarea, input') && !ui.sheet) render(); });

render();
wake().catch(() => {});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
